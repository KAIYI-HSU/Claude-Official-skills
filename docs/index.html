  <script type="application/json" id="cookbook-data">{"files":[{"path":"00-skills-spec-and-template.md","title":"Agent Skills 規範與 Template 速覽","content":"# Agent Skills 規範與 Template 速覽\n\n## 一句話定位\n\n**Skill** 是一個資料夾，內含 `SKILL.md`（必要）與選擇性的 scripts、references、examples、assets，讓 Claude 在偵測到觸發條件時動態載入並執行特定任務。\n\n## SKILL.md 最小結構（template/SKILL.md）\n\n```markdown\n---\nname: my-skill-name\ndescription: A clear description of what this skill does and when to use it\n---\n\n# My Skill Name\n\n[在此撰寫 Claude 啟用此 skill 時應遵循的指示]\n```\n\n只有兩個必要欄位：\n- `name`：唯一識別碼，使用 kebab-case（小寫＋連字符）\n- `description`：明確描述這個 skill 做什麼、何時該觸發\n\n> 完整官方規範位於 <https://agentskills.io/specification>，倉庫內 `spec/agent-skills-spec.md` 僅為轉址說明。\n\n---\n\n## Skill 資料夾常見子目錄\n\n| 子目錄 | 用途 | 範例 |\n|--------|------|------|\n| `scripts/` | 可執行 Python/Shell 工具，Claude 把它當 black box 呼叫 | `webapp-testing/scripts/with_server.py` |\n| `references/` | 補充參考文件（不必每次載入），用於 progressive disclosure | `mcp-builder/reference/python_mcp_server.md` |\n| `shared/` | 多語言共享文件 | `claude-api/shared/managed-agents-*.md` |\n| `examples/` | 範例輸入／輸出，方便 Claude 模仿 | `internal-comms/examples/3p-updates.md` |\n| `assets/` | 字型、圖片、模板等靜態資源 | `canvas-design/canvas-fonts/` |\n| `agents/` | 子 agent 的角色提示 | `skill-creator/agents/grader.md` |\n| `templates/` | 完整模板檔（HTML/JS/XML） | `algorithmic-art/templates/viewer.html` |\n\n---\n\n## 設計哲學三原則\n\n### 1. Progressive Disclosure（漸進式揭露）\n\nSKILL.md 主檔案盡量精簡（< 500 行），把細節放到 `references/`，讓 Claude 在需要時才讀取。例如：\n- `pdf/SKILL.md`（簡潔速查）vs `pdf/REFERENCE.md`（pypdfium2 等深度內容）\n- `pptx/SKILL.md`（總覽）vs `pptx/pptxgenjs.md`（從零建立詳細指南）\n\n### 2. Script as Black Box（腳本即黑箱）\n\nClaude 應把 script 當作 `--help` 後直接使用的 CLI 工具，**不必逐行讀原始碼**。這降低 token 消耗、減少誤解。\n- 反例：在每次寫 GIF 前都把 `frame_composer.py` 讀一遍\n- 正例：先 `python script.py --help` 看接口，直接呼叫\n\n### 3. YAML Frontmatter 嚴格性\n\n`description` 欄位的措辭直接影響觸發準確率。`skill-creator` 還提供 `run_loop.py` 自動優化此欄位（詳見 [skill-creator 章節](./03-dev-technical-skills/skill-creator.md)）。\n\n---\n\n## 倉庫的 marketplace.json\n\n`/.claude-plugin/marketplace.json` 把 17 個 skills 分成 3 個 plugin bundle：\n\n```json\n{\n  \"plugins\": [\n    {\"name\": \"document-skills\", \"skills\": [\"./skills/xlsx\", \"./skills/docx\", \"./skills/pptx\", \"./skills/pdf\"]},\n    {\"name\": \"example-skills\", \"skills\": [/* 12 個 example */]},\n    {\"name\": \"claude-api\", \"skills\": [\"./skills/claude-api\"]}\n  ]\n}\n```\n\n在 Claude Code 裡可透過 `/plugin marketplace add anthropics/skills` 註冊，再選擇 bundle 安裝。\n\n---\n\n## 自製 Skill 的最簡步驟\n\n1. `cp -r template/ my-skill/`\n2. 編輯 `my-skill/SKILL.md` 的 frontmatter（name + description）\n3. 撰寫指示主文（範例、規範、流程）\n4. 視需求新增 `scripts/`、`references/`、`examples/`\n5. 用 `skill-creator` 跑評估，根據 `run_loop.py` 結果優化 description\n\n---\n\n## 延伸閱讀\n\n- 官方規範：<https://agentskills.io/specification>\n- 官方 Skills 倉庫：<https://github.com/anthropics/skills>\n- 本倉庫 `template/SKILL.md`：最簡可用模板\n- 本倉庫 `skills/skill-creator/SKILL.md`：完整 skill 開發流程（含評估迴圈）\n"},{"path":"01-document-skills/README.md","title":"文件處理類 Skills","content":"# 文件處理類 Skills\n\n這 5 個 skills 構成 Anthropic 在 Claude.ai 內提供「建立／編輯文件」能力的核心。其中 docx/pdf/pptx/xlsx 是 source-available（非 Apache 2.0），因為它們正在生產環境運行。\n\n| Skill | 主要產物 | 必裝依賴 |\n|-------|----------|----------|\n| [docx](./docx.md) | `.docx` | `npm install -g docx`、pandoc、LibreOffice |\n| [pdf](./pdf.md) | `.pdf` | `pip install pypdf pdfplumber reportlab`、qpdf、poppler |\n| [pptx](./pptx.md) | `.pptx` | `npm install pptxgenjs`、LibreOffice、markitdown |\n| [xlsx](./xlsx.md) | `.xlsx` | `pip install openpyxl pandas`、LibreOffice |\n| [doc-coauthoring](./doc-coauthoring.md) | 任意文件 | 純流程，無依賴 |\n\n## 共通設計模式\n\n### 1. ZIP-XML Unpack/Pack 三步驟（docx + pptx + xlsx）\n\n`.docx`、`.pptx`、`.xlsx` 本質上都是 ZIP 內含 XML 檔。三者共用 `scripts/office/` 工具集：\n\n```bash\npython scripts/office/unpack.py document.docx unpacked/   # 1. 拆解\n# 編輯 unpacked/word/document.xml ...                     # 2. 編輯 XML\npython scripts/office/pack.py unpacked/ output.docx        # 3. 重組\npython scripts/office/validate.py output.docx              # 驗證\n```\n\n### 2. Pandoc 與 markitdown 作為 Reader\n\n讀取現成文件不要自己解析，用工具：\n- `pandoc --track-changes=all document.docx -o output.md`\n- `python -m markitdown presentation.pptx`\n\n### 3. LibreOffice 作為「最後手段」\n\n複雜的計算（xlsx 公式重算、tracked changes 接受、PDF 轉換）統一用 `soffice` headless 模式：\n\n```bash\npython scripts/office/soffice.py --headless --convert-to pdf document.docx\n```\n\n---\n\n## 推薦學習順序\n\n1. **doc-coauthoring** — 純流程概念，先理解「如何結構化共筆」\n2. **pdf** — 最容易上手，Python 一條龍\n3. **docx** — 進入 XML 操作的入門款\n4. **xlsx** — 公式邏輯重要，學「絕對不要硬編碼數字」\n5. **pptx** — 集大成，含視覺 QA 與設計哲學\n"},{"path":"01-document-skills/doc-coauthoring.md","title":"doc-coauthoring — 結構化共筆流程","content":"# doc-coauthoring — 結構化共筆流程\n\n## 一句話定位\n\n不是工具型 skill，而是**流程型** skill：把「Claude 幫使用者寫一份正式文件」拆成三階段（資訊蒐集 → 精煉 → 讀者測試），避免一次性產出冗長文章卻句句不到位。\n\n## 何時觸發\n\n- \"幫我寫提案\"、\"draft a proposal\"、\"create a spec\"、\"撰寫 RFC\"\n- 任何結構化、有受眾、有目的的長文（決策文件、技術設計文件、年度回顧）\n\n## 目錄結構速覽\n\n```\nskills/doc-coauthoring/\n└── SKILL.md     # 唯一檔案，~16KB，純流程描述\n```\n\n> 沒有 scripts、沒有 examples——這是「方法論」型 skill 的代表作。\n\n## 核心觀念與工作流\n\n### 三階段流程\n\n#### 🎯 Stage 1: Context Gathering（資訊蒐集）\n\n**目標**：在落筆前把使用者腦中的隱性知識全榨出來。\n\n操作：\n1. **Meta-context 提問**：受眾是誰？影響什麼決策？有沒有公司常用範本？\n2. **Info dumping**：請使用者貼 Slack 訊息、Drive 文件、email 內容、會議摘要\n3. **Clarifying questions**：根據 gap 主動問「我注意到你沒提到 X，這部分你怎麼想？」\n\n**為什麼重要**：80% 的失敗草稿是因為 Claude 一開始就沒搞清楚「文件存在的目的」。\n\n#### ✏️ Stage 2: Refinement & Structure（精煉與結構化）\n\n**目標**：以 section 為單位反覆迭代，避免一次重寫整篇。\n\n操作：\n1. 為每個 section 提 clarifying questions\n2. **Brainstorm 5–20 點**（別只給 3 點，要遍歷可能性）\n3. **Curation**：保留／移除／合併\n4. **Gap check**：「漏了什麼？」\n5. **Drafting with surgical edits**：用 Edit tool 改局部，**永遠不要 reprint 整篇**\n6. **Iterative refinement**：使用者反饋 → 局部修\n\n#### 🔍 Stage 3: Reader Testing（讀者測試）\n\n**目標**：用「全新眼睛」確認冷讀者也能看懂。\n\n操作：\n1. 預測讀者會問哪些問題\n2. **Spawn fresh Claude subagent**（沒有任何上下文）讀文件並提問\n3. 或請使用者貼到 Claude.ai 新對話\n4. 找出 ambiguity，回頭修\n5. 確認後才 release\n\n> **這個 fresh-eyes 模式**也出現在 `pptx`、`skill-creator`，是 Anthropic 官方愛用的元 pattern。\n\n## 精華 Script 與可提取資源\n\n雖然此 skill 沒有 script，但它的**流程模板**極具重用價值：\n\n### 📝 Stage 1 提問模板\n\n```\n- 這份文件的主要受眾是誰？（執行長／工程同事／外部客戶？）\n- 讀完後你希望他們做什麼決定／行動？\n- 有沒有公司常用的格式或範例可以參考？\n- 有相關的 Slack 討論串、Drive 文件、email 紀錄可以提供嗎？\n- 截止日期？篇幅期望？\n```\n\n### 📝 Stage 2 Section 開展模板\n\n```\nFor each section:\n1. \"這段要回答什麼核心問題？\"\n2. \"幫我列 10 個可能的論點\"\n3. \"哪 3 個最重要？哪些可以合併？\"\n4. \"還有什麼角度沒考慮？\"\n5. <draft>\n6. \"這段哪裡卡？\"\n```\n\n### 📝 Stage 3 Reader Test 模板\n\n```\n你是第一次看到這份文件的 [角色]。\n請完整讀過，然後告訴我：\n1. 你看完後的主要 takeaway 是什麼？\n2. 哪 3 個地方你需要重看才懂？\n3. 你會問作者哪些問題？\n4. 哪些段落讓你想跳過？\n```\n\n## 可移植到自家專案的模式\n\n1. **三階段框架**：Context → Refinement → Reader Test，可以套用到：\n   - 寫 README\n   - 寫 PR description\n   - 寫部落格文章\n   - 寫產品 spec\n\n2. **Surgical Edit 原則**：迭代時用 `Edit` 工具改局部，不要 `Write` 整檔重來。理由：\n   - 使用者可一目了然看到改動\n   - Token 消耗少\n   - 不會誤刪好句\n\n3. **Brainstorm 5–20 點**：強制廣度搜索，比起「給我 3 個點子」更能避免淺薄。\n\n4. **Subagent 冷讀者**：用 `Agent({subagent_type: \"general-purpose\"})` 啟動沒有對話歷史的 Claude，模擬真實讀者。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 直接開始寫 → 沒搞清楚受眾與目的，產出泛泛之談\n- ❌ 一次重寫整篇 → 浪費 token、改壞好段落；✅ 用 Edit 局部改\n- ❌ 跳過 reader test → 作者盲點留到 release；✅ 一定要 fresh eyes 過\n- ❌ 用「我覺得這樣寫好」替代用戶意圖 → 文件變成 Claude 的而非使用者的\n\n## 延伸閱讀\n\n- 官方檔：[`skills/doc-coauthoring/SKILL.md`](../../skills/doc-coauthoring/SKILL.md)\n- 相似的 fresh-eyes 模式：[`skills/pptx/SKILL.md`](../../skills/pptx/SKILL.md)（視覺 QA）、[`skills/skill-creator/SKILL.md`](../../skills/skill-creator/SKILL.md)（grader subagent）\n"},{"path":"01-document-skills/docx.md","title":"docx — Word 文件全能助手","content":"# docx — Word 文件全能助手\n\n## 一句話定位\n\n用 `docx-js`（JavaScript）建立、用 `unpack/pack` XML 工具編輯 `.docx` 檔，涵蓋追蹤修訂、註解、TOC、頁首頁尾、多欄排版、嵌入圖片等所有 Word 進階特性。\n\n## 何時觸發\n\n- 使用者提到 \"Word doc\"、\"word document\"、\"`.docx`\"、\"備忘錄\"、\"報告\"、\"信件\"\n- 要求製作含 TOC、頁碼、頁首／頁尾的專業文件\n- 需要處理 tracked changes 或 comments\n- 從 `.docx` 抽取或重組內容、做 find-and-replace、嵌入圖片\n\n不適用於：PDF、試算表、Google Docs、與文件無關的程式任務。\n\n## 目錄結構速覽\n\n```\nskills/docx/\n├── SKILL.md                 # 主指引（~600 行）\n├── LICENSE.txt              # Anthropic 自有授權\n└── scripts/\n    ├── comment.py           # 自動產生 comments.xml + 標記\n    ├── accept_changes.py    # 接受所有追蹤修訂（用 LibreOffice）\n    ├── templates/           # comments / commentsExtended / people 範本\n    └── office/              # 共享工具（與 pptx/xlsx 共用）\n        ├── unpack.py        # .docx → 解壓 + 美化 XML + 智慧引號實體化\n        ├── pack.py          # 資料夾 → .docx + 自動修正\n        ├── validate.py      # 驗證 OOXML schema\n        ├── soffice.py       # LibreOffice headless 包裝\n        └── helpers/\n            ├── merge_runs.py\n            └── simplify_redlines.py\n```\n\n## 核心觀念與工作流\n\n### 任務 → 工具對應表\n\n| 任務 | 方案 |\n|------|------|\n| 讀取／分析內容 | `pandoc` 或 `unpack.py` 看原始 XML |\n| 建立新文件 | `docx-js`（JavaScript） |\n| 編輯既有文件 | unpack → 編輯 XML → pack |\n\n### 建立新文件（docx-js 樣板）\n\n```javascript\nconst { Document, Packer, Paragraph, TextRun, PageOrientation } = require('docx');\n\nconst doc = new Document({\n  styles: {\n    default: { document: { run: { font: \"Arial\", size: 24 } } }, // 12pt\n  },\n  sections: [{\n    properties: {\n      page: {\n        size: { width: 12240, height: 15840 },  // US Letter（DXA）\n        margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 }\n      }\n    },\n    children: [\n      new Paragraph({ children: [new TextRun(\"Hello\")] })\n    ]\n  }]\n});\n\nPacker.toBuffer(doc).then(buf => fs.writeFileSync(\"doc.docx\", buf));\n```\n\n**DXA 單位換算**：1440 DXA = 1 inch；US Letter 是 12240×15840、A4 是 11906×16838（docx-js 預設是 A4，務必明寫）。\n\n### 編輯既有文件（三步驟）\n\n```bash\n# 1) 拆解：自動美化 XML、合併相鄰 run、智慧引號→XML 實體\npython scripts/office/unpack.py document.docx unpacked/\n\n# 2) 編輯 unpacked/word/document.xml（直接用 Edit tool 替換字串，不要寫 Python 腳本）\n\n# 3) 重組：自動驗證、修正 durableId、補 xml:space=\"preserve\"\npython scripts/office/pack.py unpacked/ output.docx --original document.docx\n```\n\n## 精華 Script 與可提取資源\n\n### 🔧 `scripts/office/unpack.py`（極具重用價值）\n\n把任何 `.docx` / `.pptx` / `.xlsx` 拆成可編輯的 XML 樹，且：\n- 自動美化排版\n- 合併連續 `<w:r>` runs（讓 find-replace 更可靠）\n- 智慧引號 (' ' \" \") 自動轉成 `&#x2019;` 等 XML 實體，避免編輯時被破壞\n\n### 🔧 `scripts/office/pack.py`\n\n逆操作。額外提供 **auto-repair**：\n- `durableId >= 0x7FFFFFFF` → 自動重新生成\n- `<w:t>` 含前後空白 → 自動補 `xml:space=\"preserve\"`\n- 失敗時清楚告訴你哪裡 schema violation\n\n### 🔧 `scripts/comment.py`\n\n封裝增加註解的 boilerplate（要寫 `comments.xml`、`commentsExtended.xml`、`people.xml` 三個檔）：\n\n```bash\npython scripts/comment.py unpacked/ 0 \"Comment text with &amp; and &#x2019;\"\npython scripts/comment.py unpacked/ 1 \"Reply text\" --parent 0    # 回覆\npython scripts/comment.py unpacked/ 0 \"Text\" --author \"Custom\"\n```\n\n### 🔧 `scripts/accept_changes.py`\n\n```bash\npython scripts/accept_changes.py input.docx output.docx\n```\n\n底層用 LibreOffice 把追蹤修訂全部接受，輸出乾淨檔。\n\n## 可移植到自家專案的模式\n\n1. **DXA 常數表**：1440 DXA = 1 inch，content width = page width − 左右 margin。建議自家專案內也建一個 `constants.js` 集中管理。\n\n2. **Smart Quote XML 實體對照**：\n   ```\n   &#x2018;  ‘   左單引號\n   &#x2019;  ’   右單引號（撇號）\n   &#x201C;  \"   左雙引號\n   &#x201D;  \"   右雙引號\n   ```\n\n3. **追蹤修訂 minimal-edit pattern**：\n   ```xml\n   <w:r><w:t>The term is </w:t></w:r>\n   <w:del w:id=\"1\" w:author=\"Claude\" w:date=\"...\">\n     <w:r><w:delText>30</w:delText></w:r>\n   </w:del>\n   <w:ins w:id=\"2\" w:author=\"Claude\" w:date=\"...\">\n     <w:r><w:t>60</w:t></w:r>\n   </w:ins>\n   <w:r><w:t> days.</w:t></w:r>\n   ```\n   只標記變動的部分，保留前後文，避免「整段被刪重寫」。\n\n4. **Bullet List 正確做法**（非 unicode 字元）：\n   ```javascript\n   numbering: { config: [\n     { reference: \"bullets\",\n       levels: [{ level: 0, format: LevelFormat.BULLET, text: \"•\" }] }\n   ]}\n   ```\n\n## 常見陷阱（Gotchas）\n\n⚠️ **以下是 SKILL.md 明確警告的雷區**，可直接複製到自家 docx 專案的 lint 規則：\n\n- ❌ 不要設 `WidthType.PERCENTAGE`（在 Google Docs 會壞）→ ✅ 一律 `WidthType.DXA`\n- ❌ 不要直接打 `•` 或 `•` 當 bullet → ✅ 用 `LevelFormat.BULLET` + numbering config\n- ❌ 不要用 `\\n` 換行 → ✅ 拆成多個 `Paragraph`\n- ❌ 不要把 `PageBreak` 獨立成 child → ✅ 必須包在 `Paragraph` 內\n- ❌ 不要用 table 當分隔線 → ✅ 用 `Paragraph` 的 `border.bottom`\n- ❌ TOC 的 heading 不要套自訂 style → ✅ 只能用內建的 `HeadingLevel.HEADING_1` 等\n- ❌ Heading 漏寫 `outlineLevel` → TOC 抓不到\n- ❌ Tables 只設 `columnWidths` 不設 cell `width` → 部分平台渲染錯誤\n- ❌ `ImageRun` 漏 `type: \"png\"` → 直接報錯\n\n## 延伸閱讀\n\n- 官方檔：[`skills/docx/SKILL.md`](../../skills/docx/SKILL.md)\n- 註解範本：[`skills/docx/scripts/templates/`](../../skills/docx/scripts/templates/)\n- 共享 office 工具：[`skills/docx/scripts/office/`](../../skills/docx/scripts/office/)\n- 跨 skill office 共通模式：[../99-cross-skill-patterns.md](../99-cross-skill-patterns.md)\n"},{"path":"01-document-skills/pdf.md","title":"pdf — PDF 全能武器庫","content":"# pdf — PDF 全能武器庫\n\n## 一句話定位\n\n把 PDF 任何操作收斂成「pypdf / pdfplumber / reportlab + 命令列工具」三大武器，並提供現成的表單填寫、OCR、加密、浮水印 script。\n\n## 何時觸發\n\n- 任何 `.pdf` 檔的讀寫、合併、拆解、旋轉、加浮水印\n- 建立新 PDF、填表單、加密／解密\n- 抽取圖片、表格、文字\n- OCR 掃描型 PDF\n\n## 目錄結構速覽\n\n```\nskills/pdf/\n├── SKILL.md                     # 主指引（速查 + Python 模式）\n├── REFERENCE.md                 # 進階：pypdfium2、JavaScript pdf-lib、疑難排解\n├── FORMS.md                     # 表單填寫專用指南\n├── LICENSE.txt\n└── scripts/\n    ├── fill_fillable_fields.py       # 填寫 PDF 表單欄位\n    ├── extract_form_field_info.py    # 列出所有欄位資訊\n    ├── extract_form_structure.py     # 解析欄位階層／類型\n    ├── check_fillable_fields.py      # 驗證能否填寫\n    ├── check_bounding_boxes.py       # 驗證版面 bbox\n    ├── create_validation_image.py    # 產生填寫後預覽圖\n    └── convert_pdf_to_images.py      # PDF → JPG/PNG\n```\n\n## 核心觀念與工作流\n\n### 任務 → 最佳工具表\n\n| 任務 | 最佳工具 | 說明 |\n|------|----------|------|\n| 合併 PDF | pypdf | `PdfWriter().add_page()` |\n| 拆解 PDF | pypdf | 一頁一檔 |\n| 抽文字 | pdfplumber | `page.extract_text()` |\n| 抽表格 | pdfplumber | `page.extract_tables()` |\n| 建新 PDF | reportlab | Canvas（簡單）或 Platypus（多頁） |\n| 命令列合併 | qpdf | `qpdf --empty --pages ...` |\n| 掃描 PDF OCR | pytesseract + pdf2image | 先轉圖再辨識 |\n| 填表單 | `scripts/fill_fillable_fields.py` | 見 FORMS.md |\n\n### Python 三大武器\n\n```python\n# 1. pypdf — 基本操作\nfrom pypdf import PdfReader, PdfWriter\nreader = PdfReader(\"doc.pdf\")\ntext = \"\".join(p.extract_text() for p in reader.pages)\n\n# 2. pdfplumber — 抽表格保留版面\nimport pdfplumber\nwith pdfplumber.open(\"doc.pdf\") as pdf:\n    for page in pdf.pages:\n        tables = page.extract_tables()\n\n# 3. reportlab — 建立 PDF（Platypus 多頁）\nfrom reportlab.platypus import SimpleDocTemplate, Paragraph, PageBreak\nfrom reportlab.lib.styles import getSampleStyleSheet\ndoc = SimpleDocTemplate(\"report.pdf\")\nstyles = getSampleStyleSheet()\nstory = [Paragraph(\"Title\", styles[\"Title\"]), PageBreak()]\ndoc.build(story)\n```\n\n### 命令列三劍客\n\n```bash\n# pdftotext —— 快速抽文字（保留版面）\npdftotext -layout input.pdf output.txt\npdftotext -f 1 -l 5 input.pdf output.txt        # 抽第 1-5 頁\n\n# qpdf —— 合併、拆解、旋轉、解密\nqpdf --empty --pages a.pdf b.pdf -- merged.pdf\nqpdf in.pdf --pages . 1-5 -- chunk.pdf\nqpdf in.pdf out.pdf --rotate=+90:1\nqpdf --password=secret --decrypt enc.pdf dec.pdf\n\n# pdfimages —— 抽出所有嵌入圖片\npdfimages -j input.pdf prefix\n```\n\n## 精華 Script 與可提取資源\n\n### 🔧 `scripts/fill_fillable_fields.py`\n\nPDF 表單填寫的 production-ready 範本。能：\n- 自動偵測欄位（text / checkbox / radio / dropdown）\n- 處理座標式填寫\n- 輸出填好後的 PDF\n\n> 配套使用：`extract_form_field_info.py`（先看欄位）、`create_validation_image.py`（產生預覽 PNG 確認結果）。\n\n### 🔧 OCR 流程（從 SKILL.md 萃取）\n\n```python\nfrom pdf2image import convert_from_path\nimport pytesseract\n\nimages = convert_from_path(\"scanned.pdf\")\ntext = \"\\n\".join(\n    f\"Page {i+1}:\\n{pytesseract.image_to_string(img)}\"\n    for i, img in enumerate(images)\n)\n```\n\n### 🔧 浮水印模式\n\n```python\nfrom pypdf import PdfReader, PdfWriter\n\nwatermark = PdfReader(\"watermark.pdf\").pages[0]\nreader = PdfReader(\"document.pdf\")\nwriter = PdfWriter()\nfor page in reader.pages:\n    page.merge_page(watermark)        # 直接 merge_page 即可疊上\n    writer.add_page(page)\nwriter.write(\"watermarked.pdf\")\n```\n\n## 可移植到自家專案的模式\n\n1. **任務 → 工具速查表**：本 skill 把 PDF 操作分解成 8 種任務，每種只用 1 個最佳工具。可直接抄這張表進你專案的 README。\n\n2. **`<sub>`/`<super>` 而非 unicode**（reportlab Platypus）：\n   ```python\n   chemical = Paragraph(\"H<sub>2</sub>O\", styles[\"Normal\"])\n   squared = Paragraph(\"x<super>2</super> + y<super>2</super>\", styles[\"Normal\"])\n   ```\n   理由：reportlab 內建字型沒有 ₀₁₂₃ ⁰¹²³ 這些字符，會渲染成黑方塊。\n\n3. **加密保護**：\n   ```python\n   writer.encrypt(\"user-pwd\", \"owner-pwd\")    # user 開啟用、owner 編輯用\n   ```\n\n4. **抽表格直接餵 pandas**：\n   ```python\n   df = pd.DataFrame(table[1:], columns=table[0])\n   df.to_excel(\"out.xlsx\", index=False)\n   ```\n\n## 常見陷阱（Gotchas）\n\n- ❌ 在 reportlab 用 `H₂O` Unicode 下標 → 渲染成黑方塊；✅ 用 `<sub>` tag\n- ❌ 一律 `pypdf.extract_text()` → 表格會破碎；✅ 表格用 pdfplumber\n- ❌ 自寫 PDF 解析 → 直接用 pdfplumber／pypdf\n- ❌ 對掃描檔 `extract_text()` 期望抽到字 → 必須先 OCR\n- ❌ 忘記 `extract_tables()` 可能回傳 `None` → 加 `if table:` 判空\n\n## 延伸閱讀\n\n- 官方檔：[`skills/pdf/SKILL.md`](../../skills/pdf/SKILL.md)\n- 進階：[`skills/pdf/REFERENCE.md`](../../skills/pdf/REFERENCE.md)\n- 表單專書：[`skills/pdf/FORMS.md`](../../skills/pdf/FORMS.md)\n- 表單腳本：[`skills/pdf/scripts/fill_fillable_fields.py`](../../skills/pdf/scripts/fill_fillable_fields.py)\n"},{"path":"01-document-skills/pptx.md","title":"pptx — 簡報製作與視覺 QA 高手","content":"# pptx — 簡報製作與視覺 QA 高手\n\n## 一句話定位\n\n用 `pptxgenjs`（JS）建立、用 unpack/pack 編輯 `.pptx`，並提供「色彩 + 字型配對 + 視覺 QA」一整套設計知識，避免 AI 簡報常見的「一張白底配普通藍 bullet」醜樣。\n\n## 何時觸發\n\n- 製作簡報、pitch deck\n- 編輯既有 `.pptx`、抽取內容\n- 合併或拆解投影片、處理 layout 與 speaker notes\n\n## 目錄結構速覽\n\n```\nskills/pptx/\n├── SKILL.md           # 主指引（速查 + 工作流）\n├── editing.md         # 編輯既有簡報的詳細流程\n├── pptxgenjs.md       # 從零建立簡報的 pptxgenjs 完整指南\n├── LICENSE.txt\n└── scripts/\n    ├── thumbnail.py        # 產出投影片格狀縮圖（給 Claude 視覺檢查）\n    ├── add_slide.py        # 程式化插入新投影片\n    ├── clean.py            # 編輯後清理 XML\n    └── office/             # 共享 unpack/pack/validate（同 docx）\n```\n\n## 核心觀念與工作流\n\n### 三條路徑\n\n| 任務 | 路徑 |\n|------|------|\n| 讀取內容 | `python -m markitdown deck.pptx` |\n| 編輯既有 | unpack → 改 slide XML → clean → pack |\n| 從零建立 | `pptxgenjs`（JS） |\n\n### 視覺 QA 工作流（Anthropic 招牌做法）\n\n1. 用 LibreOffice 把 pptx 轉 PDF：`soffice --headless --convert-to pdf deck.pptx`\n2. PDF 轉成投影片縮圖：`pdftoppm -jpeg deck.pdf slide`\n3. 用 `scripts/thumbnail.py` 拼成格狀大圖\n4. 啟動 **subagent**（fresh eyes）審視，列出：重疊、文字溢出、對齊、對比、留白問題\n5. 修正 → 重複 QA\n\n> 這個 fresh-eyes subagent QA pattern 在 [`doc-coauthoring`](./doc-coauthoring.md) 也用，是值得抄到自家專案的精華。\n\n### 設計哲學（從 SKILL.md 萃取）\n\n- **色彩主導 60–70%**：選一個主色佔大面積，避免「處處是藍 bullet」\n- **Dark/Light 三明治**：開場深色 → 中段淺色 → 結尾深色，建立節奏\n- **視覺母題**：每張投影片有一個「圖形語彙」貫穿（如圓、線條、幾何）\n- **配色遠離通用藍**：依主題挑色（金融用 Forest & Moss、科技用 Coral Energy 等 10 種預設）\n- **字型配對**：標題用粗壯字（Arial Black、Georgia）配內文（Calibri、Arial），不要全用同字型\n- **尺寸標準**：標題 36–44pt、內文 14–16pt\n\n## 精華 Script 與可提取資源\n\n### 🔧 `scripts/thumbnail.py`\n\n把多張投影片拼成一張總覽 PNG，丟給 subagent 做整體視覺審查。**這個概念可以類推到任何「需要全局審視」的 UI 開發**（例如把網站每個頁面截圖拼成一張）。\n\n### 🔧 `scripts/add_slide.py`\n\n程式化插入新投影片並繼承 layout，避免從零拚 XML。\n\n### 🎨 10 套預設配色（從 pptxgenjs.md）\n\n| 主題 | 適用 |\n|------|------|\n| Midnight Executive | 高階主管簡報 |\n| Forest & Moss | 永續、自然議題 |\n| Coral Energy | 新創、科技產品 |\n| ...（共 10 種）| |\n\n> 📍 **可直接挪用**：複製 hex 碼到自家簡報模板。\n\n### 🔧 編輯既有簡報的 unpack/pack 流程\n\n```bash\npython scripts/office/unpack.py deck.pptx unpacked/\n# 編輯 unpacked/ppt/slides/slide1.xml\npython scripts/clean.py unpacked/                  # 清掉殘留亂碼\npython scripts/office/pack.py unpacked/ out.pptx\n```\n\n## 可移植到自家專案的模式\n\n1. **Visual QA via subagent**：把產物截圖、丟給另一個 LLM 做新眼睛審查。可寫成 CI step。\n\n2. **配色決策框架**：別問「想要什麼顏色」，改問「主題是什麼／受眾是誰」，再從預設配色挑。\n\n3. **`thumbnail.py` 拼圖思路**：用 PIL 把多張圖排成 grid，加邊框與索引號。50 行可寫完，極實用。\n\n4. **避雷清單**：\n   ```\n   ❌ 整張投影片只有文字\n   ❌ 文字色與背景對比不足（< 4.5:1）\n   ❌ 每張投影片都用同一 layout\n   ❌ \"Click to edit\" placeholder 殘留\n   ```\n\n## 常見陷阱（Gotchas）\n\n- ❌ 直接用 markitdown 編輯 → 會 lose formatting；✅ 編輯走 unpack/pack\n- ❌ 字型沒嵌入 → 別人開啟字會跑掉\n- ❌ 用 emoji 當圖示 → 不同平台字型差異大；✅ 用 SVG 或形狀\n- ❌ 17pt 內文 → 後排看不到；✅ ≥ 14pt（最好 16pt）\n- ❌ 全簡報用同一張 layout → 視覺單調；✅ 變化 layout，但保持母題\n\n## 延伸閱讀\n\n- 官方檔：[`skills/pptx/SKILL.md`](../../skills/pptx/SKILL.md)\n- 從零建立詳述：[`skills/pptx/pptxgenjs.md`](../../skills/pptx/pptxgenjs.md)\n- 編輯流程詳述：[`skills/pptx/editing.md`](../../skills/pptx/editing.md)\n- 視覺 QA 腳本：[`skills/pptx/scripts/thumbnail.py`](../../skills/pptx/scripts/thumbnail.py)\n"},{"path":"01-document-skills/xlsx.md","title":"xlsx — 試算表與財務模型","content":"# xlsx — 試算表與財務模型\n\n## 一句話定位\n\n用 `openpyxl` + `pandas` 建立 `.xlsx`，並透過 LibreOffice headless 重新計算公式；強制要求「**所有計算都用 Excel 公式表達，絕對不要在 Python 裡硬編碼結果**」。\n\n## 何時觸發\n\n- 建立、編輯、讀取 `.xlsx` / `.xlsm` / `.csv`\n- 加入公式、格式、圖表\n- 清理混亂的表格資料\n- 產出財務模型、預算、儀表板\n\n## 目錄結構速覽\n\n```\nskills/xlsx/\n├── SKILL.md                # 主指引（含財務模型配色規範）\n├── LICENSE.txt\n└── scripts/\n    ├── recalc.py           # LibreOffice 重算公式 + 錯誤偵測\n    └── office/             # 共享 unpack/pack/validate（含 Excel schemas）\n```\n\n## 核心觀念與工作流\n\n### 工具分工\n\n| 任務 | 工具 |\n|------|------|\n| 純資料分析、批次處理 | `pandas` |\n| 公式、格式、Excel 專屬功能 | `openpyxl` |\n| 重新計算公式（讓 `=SUM` 真正算出值） | `python scripts/recalc.py` |\n\n### 核心鐵律：用公式，不用硬編碼\n\n**❌ 反例**（Python 直接算結果填值）：\n```python\nws[\"B5\"] = sum(ws[f\"B{i}\"].value for i in range(1, 5))    # ❌ 寫死數字\n```\n\n**✅ 正例**（Python 寫公式字串）：\n```python\nws[\"B5\"] = \"=SUM(B1:B4)\"                                   # ✅ 真正的 Excel 公式\n```\n\n理由：使用者打開 Excel 改動上游數字時，公式會自動更新；硬編碼數字則永遠不變，這是嚴重 bug。\n\n### 重新計算流程\n\n```bash\n# 1. 用 openpyxl 建立檔案 + 寫入公式字串\npython my_script.py\n# 2. recalc.py 用 LibreOffice 開檔並計算所有公式\npython scripts/recalc.py model.xlsx\n# 3. 同時偵測 #REF! / #DIV/0! / #VALUE! / #NAME? / #N/A 並回報位置\n```\n\n`recalc.py` 會輸出 JSON：\n```json\n{\"errors\": [{\"sheet\": \"Inputs\", \"cell\": \"C7\", \"type\": \"#DIV/0!\"}]}\n```\n\n### 財務模型配色規範（金融業共識）\n\n| 顏色 | 用途 |\n|------|------|\n| 🔵 藍字 | 輸入值（使用者要改的） |\n| ⚫ 黑字 | 公式（自動計算） |\n| 🟢 綠字 | 內部 sheet 連結 |\n| 🔴 紅字 | 外部檔案連結 |\n| 🟡 黃底 | 關鍵假設 cell |\n\n### 數字格式標準\n\n| 類型 | 格式 |\n|------|------|\n| 貨幣 | `$#,##0` 或 `$#,##0.00` |\n| 百分比 | `0.0%` |\n| 倍數 | `0.0\"x\"` |\n| 負數 | `(#,##0)` 用括號表示 |\n\n## 精華 Script 與可提取資源\n\n### 🔧 `scripts/recalc.py`（極具重用價值）\n\n把 openpyxl 寫的「死」公式跑成「活」結果。背後是 `soffice --headless --calc`，並掃描所有 cell 找錯誤。\n\n**可直接抄到自家專案**：當你的工具產 Excel 時，跑一次 recalc 確保結果正確。\n\n### 🔧 完整建模樣板\n\n```python\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Font, PatternFill, Alignment\n\nwb = Workbook()\nws = wb.active\nws.title = \"Model\"\n\n# 1. 輸入值（藍字）\nws[\"B1\"] = 1000\nws[\"B1\"].font = Font(color=\"0000FF\")\n\n# 2. 公式（黑字）\nws[\"B5\"] = \"=B1*$D$1\"            # 用 $ 鎖住假設\nws[\"B5\"].number_format = \"$#,##0.00\"\n\n# 3. 關鍵假設 cell（黃底）\nws[\"D1\"] = 0.15\nws[\"D1\"].fill = PatternFill(\"solid\", fgColor=\"FFFF00\")\nws[\"D1\"].number_format = \"0.0%\"\n\nwb.save(\"model.xlsx\")\n# 然後跑 recalc.py 讓公式真的算出來\n```\n\n## 可移植到自家專案的模式\n\n1. **「公式優先」rule**：寫一條 lint 規則，禁止在 cell 寫純數字結果，必須是 `=...` 公式。\n\n2. **錯誤類型對照表**：把 `#REF!` 等 6 種錯誤的常見原因寫進專案 wiki：\n   - `#REF!` — 引用了被刪除的 cell\n   - `#DIV/0!` — 除以 0 或空值\n   - `#VALUE!` — 型別錯（數值算文字）\n   - `#NAME?` — 函式名拼錯\n   - `#N/A` — 查找失敗\n   - `#NULL!` — range 交集為空\n\n3. **資料來源備註格式**：\n   ```\n   Source: Company 10-K, FY2024, Page 45, \"Revenue by Segment\" table\n   ```\n   養成在每個輸入值的相鄰 cell 寫來源的習慣。\n\n4. **絕對引用 vs 相對引用**：假設 cell 用 `$D$1`，可被 fill-down 不變動。\n\n## 常見陷阱（Gotchas）\n\n- ❌ openpyxl 寫公式後不重算 → 開檔時 cell 顯示 0；✅ 跑 `recalc.py`\n- ❌ 用 Python 算結果寫死 → 上游改值不會更新\n- ❌ 整列複製公式忘記用 `$` → 引用錯欄\n- ❌ 金額沒設 number_format → 顯示成 `1234.567`\n- ❌ 大型模型沒分 sheet → 公式跨 sheet 連結混亂；✅ 分 Inputs / Calcs / Outputs\n\n## 延伸閱讀\n\n- 官方檔：[`skills/xlsx/SKILL.md`](../../skills/xlsx/SKILL.md)\n- 重算腳本：[`skills/xlsx/scripts/recalc.py`](../../skills/xlsx/scripts/recalc.py)\n- 共享 office 工具：[`skills/xlsx/scripts/office/`](../../skills/xlsx/scripts/office/)\n"},{"path":"02-creative-skills/README.md","title":"創意設計類 Skills","content":"# 創意設計類 Skills\n\n這 3 個 skills 展示 Anthropic 在「視覺創作」領域的設計哲學。共通主題：**先寫設計宣言（philosophy），再執行**。這個「Philosophy-First」雙步驟法值得套用到任何設計任務。\n\n| Skill | 產物 | 主要技術 |\n|-------|------|----------|\n| [canvas-design](./canvas-design.md) | 靜態 .pdf / .png 海報 | PIL + 30+ 字型 + 設計 manifesto |\n| [algorithmic-art](./algorithmic-art.md) | 互動 .html (p5.js) | seeded randomness + 參數控制 |\n| [slack-gif-creator](./slack-gif-creator.md) | 動畫 .gif | PIL + GIFBuilder + easing |\n\n## 共通設計模式：Philosophy-First 雙步驟\n\ncanvas-design 與 algorithmic-art 都採用：\n\n### Step 1: 寫設計宣言（4–6 段，~300 字）\n- 命名一個運動／流派（如 \"Concrete Poetry\"、\"Quantum Harmonics\"）\n- 描述美學主張：form / space / color / composition\n- 強調工匠精神：用 \"meticulously crafted\"、\"painstaking attention\" 等語彙\n- 埋入低調概念線索（不大聲宣告）\n\n### Step 2: 用具體媒介實現\n- canvas-design：PIL 畫到 PDF/PNG\n- algorithmic-art：p5.js 寫成 HTML\n\n> **為什麼有效**：先想清楚「美學是什麼」再下筆，能避免「亂試一通」的隨機輸出。\n\n## 推薦學習順序\n\n1. **slack-gif-creator** — 最務實，提供大量可重用 Python utilities\n2. **canvas-design** — 學「設計宣言」這個元 pattern\n3. **algorithmic-art** — 學 viewer.html 模板與參數設計\n"},{"path":"02-creative-skills/algorithmic-art.md","title":"algorithmic-art — 程式生成藝術","content":"# algorithmic-art — 程式生成藝術\n\n## 一句話定位\n\n用 p5.js 生成可互動的演算法藝術作品，內建 Anthropic 品牌化 viewer.html 模板（含 seed 控制、參數滑桿），輸出單一 self-contained HTML 檔。\n\n## 何時觸發\n\n- \"generative art\"、\"algorithmic art\"、\"code art\"\n- 流場（flow field）、粒子系統、L-system、Voronoi、circle packing\n- 需要「同樣 seed 產出同樣畫面」的可重現作品\n- 不適用：靜態海報（用 canvas-design）\n\n## 目錄結構速覽\n\n```\nskills/algorithmic-art/\n├── SKILL.md                       # 主指引（雙步驟 + p5.js 實作指南）\n├── LICENSE.txt\n└── templates/\n    ├── viewer.html                # 🌟 必用模板（21KB，含 Anthropic 品牌 sidebar）\n    └── generator_template.js      # 演算法組織範本（seeded、參數結構、類別）\n```\n\n## 核心觀念與工作流\n\n### 雙步驟法（同 canvas-design）\n\n#### Step 1: 寫演算法宣言（4–6 段）\n\n不同於 canvas-design 著重靜態美學，這裡描述**計算過程**：\n- Noise functions（Perlin / Simplex）\n- Particle behaviors（速度、力場、生命週期）\n- Field dynamics（向量場）\n- Parametric variation\n- Emergent complexity（局部規則 → 整體湧現）\n\n#### Step 2: 用 p5.js 實作\n\n**🚨 CRITICAL Step 0**：先讀 `templates/viewer.html`，**直接當起點檔**，不要當靈感參考。\n\n### viewer.html 結構\n\n固定區域（**禁止修改**）：\n- Layout 框架\n- Sidebar 結構\n- Anthropic 品牌（Poppins 標題 + Lora 內文字型）\n- Seed input 與按鈕\n- Action buttons（Save、Regenerate）\n\n可變區域（**自由客製**）：\n- p5.js 演算法（`setup()` + `draw()`）\n- 參數定義\n- UI 控制（滑桿、下拉選單）\n- 顏色區段（選用）\n\n### Seeded Randomness（Art Blocks 模式）\n\n```javascript\nfunction setup() {\n  createCanvas(800, 800);\n  randomSeed(seed);     // 控制 random()\n  noiseSeed(seed);      // 控制 noise()\n  // ...\n}\n```\n\n> 同一個 seed 永遠產同一張畫——這是「演算法藝術 vs 一次性圖片」的關鍵區分。\n\n### 參數設計原則\n\n❌ **錯**：列一份「常見參數選單」（amplitude、frequency、speed...）\n\n✅ **對**：從**演算法本身需要什麼**衍生：\n- 量（粒子數、線條數）\n- 尺度（網格大小、雜訊頻率）\n- 機率（分裂率、消亡率）\n- 比例（黃金比例變形、網格密度）\n- 閾值（合併距離、分支條件）\n\n### 演算法宣言範例（從 SKILL.md）\n\n| 流派 | 核心 |\n|------|------|\n| **Organic Turbulence** | 自然法則約束的混沌、Perlin 流場、數千粒子 |\n| **Quantum Harmonics** | 離散個體的相位干涉、形成 mandala |\n| **Recursive Whispers** | 跨尺度自相似、黃金比例分支、L-system |\n| **Field Dynamics** | 透過粒子軌跡可見的不可見力場 |\n| **Stochastic Crystallization** | 隨機過程結晶為秩序、Voronoi、circle packing |\n\n## 精華 Script 與可提取資源\n\n### 🌟 `templates/viewer.html`（極度推薦複製）\n\n這個 21KB 模板已封裝：\n- 響應式 sidebar layout\n- Seed 輸入 + 隨機按鈕\n- 參數 group（label + slider + value display）\n- Save canvas 按鈕（直接下載 PNG）\n- Anthropic 字型內嵌\n\n> 📍 **可挪用情境**：你要做任何「使用者調整參數即時生成視覺」的網頁工具（音波視覺化、資料藝術、教學 demo）。\n\n### 🌟 `templates/generator_template.js`\n\n示範良好的演算法程式組織：\n```javascript\nconst PARAMS = { count: 1000, scale: 0.01, speed: 1.0 };\n\nclass Particle { /* ... */ }\nconst particles = [];\n\nfunction setup() { /* seed + create */ }\nfunction draw() { /* update + render */ }\n```\n\n把 PARAMS、類別、生命週期分離，比一坨 globals 好維護。\n\n## 可移植到自家專案的模式\n\n1. **viewer.html 模板複用**：把它當成「所有互動 demo」的基礎，改 `draw()` 即可。\n\n2. **Seeded reproducibility**：任何「隨機輸出」的工具都應提供 seed，讓使用者能複現某次結果。\n\n3. **參數從演算法衍生**：寫工具時別堆 settings panel，問自己「這個演算法本質上需要哪些可調？」\n\n4. **Save canvas 一鍵下載**：\n   ```javascript\n   function saveImage() {\n     saveCanvas('artwork-' + seed, 'png');\n   }\n   ```\n\n5. **Easing functions 給動畫**：可從 [`slack-gif-creator/core/easing.py`](../../skills/slack-gif-creator/core/easing.py) 借過來改 JS。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 改 `viewer.html` 的固定區域（layout、sidebar、品牌）→ 失去設計一致性\n- ❌ 不設 `randomSeed/noiseSeed` → 每次 reload 畫面不同，無法分享\n- ❌ 用 `Math.random()` → 不受 p5 seed 控制；✅ 一律用 `random()`、`noise()`\n- ❌ 把 noise 頻率硬寫 0.01 → 應該是參數\n- ❌ 動畫 loop 不停 → CPU 飆高；視覺穩定後 `noLoop()`\n- ❌ 把所有 logic 塞 draw() → 難維護；✅ 分類別、分函式\n\n## 延伸閱讀\n\n- 官方檔：[`skills/algorithmic-art/SKILL.md`](../../skills/algorithmic-art/SKILL.md)\n- viewer 模板：[`skills/algorithmic-art/templates/viewer.html`](../../skills/algorithmic-art/templates/viewer.html)\n- generator 模板：[`skills/algorithmic-art/templates/generator_template.js`](../../skills/algorithmic-art/templates/generator_template.js)\n- 配對閱讀：[canvas-design](./canvas-design.md)（靜態版本）\n"},{"path":"02-creative-skills/canvas-design.md","title":"canvas-design — 視覺藝術與海報設計","content":"# canvas-design — 視覺藝術與海報設計\n\n## 一句話定位\n\n把「畫一張漂亮海報」這種模糊任務，拆成「先寫設計宣言（.md）→ 再執行於畫布（.pdf/.png）」兩步驟，並提供 30+ 精選字型與美術館級美學指南。\n\n## 何時觸發\n\n- 製作海報、視覺藝術、靜態設計品\n- 需要 .pdf 或 .png 的視覺輸出\n- 要求「有設計感」、「不要一般 AI 生成風格」的視覺\n- 不適用：演算法生成藝術（用 algorithmic-art）、簡報（用 pptx）\n\n## 目錄結構速覽\n\n```\nskills/canvas-design/\n├── SKILL.md                  # 主指引（雙步驟方法 + 美學要求）\n├── LICENSE.txt\n└── canvas-fonts/             # 30+ 精選字型\n    ├── ArsenalSC/\n    ├── BigShoulders/\n    ├── BricolageGrotesque/\n    ├── CrimsonPro/\n    ├── DMMono/\n    ├── EricaOne/\n    ... (共 30+ 個字型家族)\n```\n\n## 核心觀念與工作流\n\n### 雙步驟法（Philosophy → Canvas）\n\n#### Step 1: 寫設計宣言（4–6 段繁中或英文）\n\n宣言必須涵蓋（**不要**只列 layout 或 template）：\n- **Form**：輪廓、邊角、線條粗細\n- **Space**：留白比例、密度節奏\n- **Color**：色相階層、情緒氛圍\n- **Composition**：對稱／不對稱、視覺重心\n- **Visual Hierarchy**：主／次／細節\n\n並重複以下精神語彙（非雞湯，是 SKILL.md 明確要求）：\n- \"meticulously crafted\"\n- \"painstaking attention\"\n- \"master-level execution\"\n\n並埋入**低調概念線索**——例如做一張關於「等待」的海報，可暗藏砂漏意象，但不直白寫「砂漏」。\n\n#### Step 2: 在畫布實現\n\n用 PIL（Python Imaging Library）或同等工具，輸出 PDF/PNG。要求：\n- 元素須完全收容於畫布內（最少 0.5\" margin）\n- 沒有任何重疊（非設計性重疊）\n- 字距、字級、對齊都精準\n- 字型用 `canvas-fonts/` 內的 30+ 選擇\n\n### 設計宣言範例（從 SKILL.md）\n\n| 流派名 | 美學特徵 |\n|--------|----------|\n| **Concrete Poetry** | 紀念碑形式、Brutalist 空間切割、文字當稀有強烈手勢 |\n| **Chromatic Language** | 色彩作為主要資訊系統、幾何精準、Josef Albers 風 |\n| **Analog Meditation** | 安靜冥想、紋理、留白、日本攝影集美學 |\n| **Geometric Silence** | 純粹秩序、grid-based、Swiss formalism、戲劇性負空間 |\n\n## 精華 Script 與可提取資源\n\n### 🎨 `canvas-fonts/` — 30+ 字型\n\n這是這個 skill 最直接可挪用的資產。包含：\n- **Display 類**：Big Shoulders（粗壯）、Erica One、Arsenal SC\n- **Serif 類**：Crimson Pro（學院氣）、Bricolage Grotesque（現代襯線）\n- **Mono 類**：DM Mono（程式碼／技術感）\n\n> 📍 **直接複製整個 `canvas-fonts/` 到自家專案的 `assets/fonts/`** 立刻升級設計品味，不必再用 Helvetica。\n\n### 📋 設計宣言範本\n\n雖然不是 script，但可作為 prompt template 使用：\n\n```\n你是一位為 [主題] 設計海報的視覺工匠。\n\n請先寫一份 4–6 段的設計宣言：\n- 為這個美學取一個名字（運動／流派風格）\n- 描述：form, space, color, composition, hierarchy\n- 強調 meticulous craftsmanship 與 painstaking attention\n- 暗藏一個與主題相關的低調概念線索\n\n寫完後，開始用 PIL 在 [尺寸] 畫布上實現此宣言。\n所有元素須在畫布內、無重疊、字距精準。\n從 canvas-fonts/ 挑 1–2 個字型。\n```\n\n## 可移植到自家專案的模式\n\n1. **Philosophy-First 雙步驟**：套用到任何設計輸出（網頁、UI、簡報、影片開場）。先逼自己／逼 AI 寫 200 字宣言再動手，品質會明顯提升。\n\n2. **30+ 字型清單**：把這套字型納入自家設計系統。\n\n3. **「博物館 / 雜誌品質」mental model**：問自己「這張作品如果掛在 MoMA 或登 Wallpaper* 雜誌會怎樣？」當作品質檢驗。\n\n4. **概念線索 vs 直白宣告**：海報不要寫「孤獨」兩字，而是用一張空椅、一個拉長陰影暗示。應用到任何敘事性內容。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 跳過設計宣言直接畫 → 產出 generic 海報；✅ 強迫先寫\n- ❌ 元素貼齊邊緣 / 出血 → 印刷／顯示會被切；✅ 保留 0.5\" margin\n- ❌ 字型混用 5 種以上 → 視覺混亂；✅ 1–2 個字型家族\n- ❌ 用 stock photo 直接貼 → 沒設計味；✅ 自己畫幾何或抽象元素\n- ❌ 概念說太白 → 沒留思考空間；✅ 暗示而非宣告\n\n## 延伸閱讀\n\n- 官方檔：[`skills/canvas-design/SKILL.md`](../../skills/canvas-design/SKILL.md)\n- 字型庫：[`skills/canvas-design/canvas-fonts/`](../../skills/canvas-design/canvas-fonts/)\n- 對照閱讀：[`algorithmic-art`](./algorithmic-art.md)（同採 Philosophy-First 模式）\n"},{"path":"02-creative-skills/slack-gif-creator.md","title":"slack-gif-creator — Slack 動畫 GIF 神器","content":"# slack-gif-creator — Slack 動畫 GIF 神器\n\n## 一句話定位\n\n製作符合 Slack 規格（emoji 128×128、訊息 480×480、< 3s）的動畫 GIF，內附 production-ready 的 `GIFBuilder` 類別、9+ 緩動函式、8 種動畫概念樣板——本 cookbook 中**最直接可拷貝重用**的 skill。\n\n## 何時觸發\n\n- \"make me a GIF for Slack\"、\"animated GIF\"、\"emoji GIF\"\n- 製作部門內 emoji、慶祝動畫、提醒動畫\n\n## 目錄結構速覽\n\n```\nskills/slack-gif-creator/\n├── SKILL.md                 # 主指引（規格 + 動畫概念）\n├── requirements.txt         # pillow, imageio, numpy\n└── core/\n    ├── gif_builder.py       # 🌟 GIFBuilder 主類別\n    ├── validators.py        # Slack 規格驗證\n    ├── easing.py            # 🌟 14 種緩動函式（極具重用價值）\n    └── frame_composer.py    # 圖元繪製便利函式\n```\n\n## 核心觀念與工作流\n\n### Slack 規格\n\n| 類型 | 尺寸 | FPS | 顏色數 | 時長 |\n|------|------|-----|--------|------|\n| Emoji | 128×128 | 10–30 | 48–128 | < 3s |\n| 訊息 | 480×480 | 10–30 | 48–128 | < 3s |\n\n### 基本使用\n\n```python\nfrom core.gif_builder import GIFBuilder\nfrom core.frame_composer import create_blank_frame, draw_circle\n\nbuilder = GIFBuilder(size=(128, 128), fps=20)\nfor i in range(20):\n    frame = create_blank_frame(128, 128, \"white\")\n    draw_circle(frame, x=64, y=64, radius=10 + i, color=\"red\")\n    builder.add_frame(frame)\nbuilder.save(\"my.gif\")\n```\n\n### 8 種動畫概念（從 SKILL.md）\n\n| 動畫 | 核心數學 |\n|------|----------|\n| **Shake／Vibrate** | `x += sin(t) * amplitude`、`y += cos(t) * amplitude` |\n| **Pulse／Heartbeat** | `scale = 1 + sin(t) * 0.2`（0.8–1.2 間） |\n| **Bounce** | `interpolate(0, h, t, \"bounce_out\")` |\n| **Spin／Rotate** | `image.rotate(angle)` 或 sin 波擺動 |\n| **Fade In/Out** | RGBA alpha 通道 |\n| **Slide** | `interpolate` + ease_out 從畫布外滑入 |\n| **Zoom** | `image.resize(scale)` + 中心裁切 |\n| **Particle Burst** | 多粒子放射 + 重力 + alpha 衰減 |\n\n## 精華 Script 與可提取資源\n\n### 🌟 `core/easing.py`（強烈推薦複製到任何動畫專案）\n\n提供 14 種緩動函式 + 高階組合函式：\n\n```python\nfrom core.easing import interpolate, calculate_arc_motion, apply_squash_stretch\n\n# 1) 兩值內插 + 緩動（最常用）\ny = interpolate(start=10, end=90, t=0.5, easing=\"bounce_out\")\n\n# 2) 拋物線軌跡（自然投擲動作）\nx, y = calculate_arc_motion(start=(0, 100), end=(100, 100), height=50, t=0.5)\n\n# 3) 擠壓拉伸（卡通動畫感）\nsx, sy = apply_squash_stretch(base_scale=(1.0, 1.0), intensity=0.4, direction=\"vertical\")\n```\n\n完整名單：\n```\nlinear, ease_in_quad, ease_out_quad, ease_in_out_quad,\nease_in_cubic, ease_out_cubic, ease_in_out_cubic,\nease_in_bounce, ease_out_bounce, ease_in_out_bounce,\nease_in_elastic, ease_out_elastic, ease_in_out_elastic,\nease_back_in, ease_back_out, ease_back_in_out\n```\n\n> 📍 **直接複製整個 `easing.py` 進你的專案**——無依賴、純 math，對任何動畫場景（CSS-in-JS、p5.js、PIL）都有用。\n\n### 🌟 `core/gif_builder.py`\n\nGIF 組裝核心：\n- 自動 frame resize\n- 自動色彩量化（quantize to global palette）\n- DuplicateFrame 偵測（壓縮）\n- Slack-mode 自動最佳化\n\n### 🌟 `core/frame_composer.py`\n\nPIL 之上的便利層：\n```python\ncreate_blank_frame(w, h, color)\ncreate_gradient_background(w, h, top_color, bottom_color)\ndraw_circle(frame, x, y, radius, color, thickness=2)\ndraw_star(frame, cx, cy, points, outer_r, inner_r, color)\ndraw_text(frame, text, position, font, color)\n```\n\n### 🌟 `core/validators.py`\n\nGIF 出檔前確認 Slack 合規：\n- 尺寸正確\n- FPS 在 10–30\n- 顏色數 ≤ 128\n- 檔案 < 64KB（emoji 限制）\n- 時長 < 3s\n\n## 可移植到自家專案的模式\n\n1. **`easing.py` 複製**：任何動畫專案的核心。\n\n2. **GIFBuilder pattern**：把「frame 累積 → 一次輸出」邏輯封裝起來，比逐張存檔再合成乾淨：\n   ```python\n   builder = GIFBuilder(...)\n   for t in timeline:\n       builder.add_frame(render(t))\n   builder.save(\"out.gif\")\n   ```\n\n3. **Validator 前置檢查**：任何「會被外部規格約束」的輸出（icon、上傳檔案、社群圖），都該寫驗證器。\n\n4. **`interpolate` 統一介面**：`interpolate(start, end, t, easing)`——一個函式涵蓋所有 lerp 場景。\n\n5. **少色彩、多細節**：GIF 為了壓縮會限制色數，但仍能用：漸層、層次形狀、高光、邊框環、發光圓暈，做出「有質感的低色」效果。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 直接存 RGB 8-bit GIF → 大小爆炸；✅ `quantize` 到 48–128 色 + 全域 palette\n- ❌ 線寬 1px → 縮放後消失；✅ `width=2+` 為粗線\n- ❌ 純 linear 動畫 → 機械感重；✅ 至少用 `ease_out`\n- ❌ 黑邊／白邊 frame 混進序列 → 閃爍；✅ 統一 alpha 與背景色\n- ❌ FPS 太高 (> 30) → 檔案過大；Slack 通常給你限制；✅ 20 FPS 是甜蜜點\n\n## 延伸閱讀\n\n- 官方檔：[`skills/slack-gif-creator/SKILL.md`](../../skills/slack-gif-creator/SKILL.md)\n- 緩動函式（強烈推薦複製）：[`skills/slack-gif-creator/core/easing.py`](../../skills/slack-gif-creator/core/easing.py)\n- Builder 類別：[`skills/slack-gif-creator/core/gif_builder.py`](../../skills/slack-gif-creator/core/gif_builder.py)\n- 驗證器：[`skills/slack-gif-creator/core/validators.py`](../../skills/slack-gif-creator/core/validators.py)\n"},{"path":"03-dev-technical-skills/README.md","title":"開發技術類 Skills","content":"# 開發技術類 Skills\n\n這 6 個 skills 是工程師最直接受惠的部分，從 API 整合、MCP 開發、Web 測試、到自製 skill 與前端設計，幾乎涵蓋整個 LLM 應用開發流程。\n\n| Skill | 場景 | 重要程度 |\n|-------|------|----------|\n| [claude-api](./claude-api.md) | 用任何語言串接 Claude API | ⭐⭐⭐⭐⭐ |\n| [mcp-builder](./mcp-builder.md) | 寫 MCP server 給 LLM 用 | ⭐⭐⭐⭐ |\n| [skill-creator](./skill-creator.md) | meta：寫／優化／評估 skill | ⭐⭐⭐⭐⭐ |\n| [webapp-testing](./webapp-testing.md) | Playwright 測試本地 web app | ⭐⭐⭐ |\n| [web-artifacts-builder](./web-artifacts-builder.md) | 建立 React 互動 artifact | ⭐⭐⭐ |\n| [frontend-design](./frontend-design.md) | 前端品味指南 | ⭐⭐⭐ |\n\n## 共通模式\n\n### 1. Black-box Script 哲學\n\n`webapp-testing` 與 `web-artifacts-builder` 都明確要求 Claude **「先 `--help` 再用，不要讀原始碼」**。理由：scripts 可能很長，把整個檔案讀進 context 是浪費。\n> 這是值得套用到自家 CLI 工具的設計原則。\n\n### 2. Reconnaissance-then-Action\n\n`webapp-testing` 的核心 pattern：先「偵察」（截圖、列 DOM），再「行動」（下指令）。可推廣到任何不確定環境的自動化任務。\n\n### 3. Eval-driven Iteration\n\n`skill-creator` 與 `mcp-builder` 都建構在「跑評估 → 看結果 → 改 → 再跑」的迴圈上。`skill-creator` 甚至自動化此流程到 `run_loop.py` 一鍵跑 5 輪。\n\n## 推薦學習順序\n\n1. **claude-api** — 基本功（怎麼呼叫 Claude）\n2. **skill-creator** — meta-skill（怎麼產出新能力）\n3. **mcp-builder** — 把 skill 思維延伸到 service 層\n4. **webapp-testing** — 自動化驗證\n5. **web-artifacts-builder** — 進階前端輸出\n6. **frontend-design** — 品味升級\n"},{"path":"03-dev-technical-skills/claude-api.md","title":"claude-api — Claude API / SDK 開發指南","content":"# claude-api — Claude API / SDK 開發指南\n\n## 一句話定位\n\n把「在 Python / TypeScript / Java / Go / Ruby / PHP / C# / cURL 任一語言串接 Claude API」的所有最佳實務（模型選擇、prompt caching、tool use、Managed Agents、模型遷移）打包成一份多語言參考手冊。\n\n## 何時觸發\n\n- 程式碼出現 `import anthropic` 或 `@anthropic-ai/sdk`\n- 使用者問 Claude API、Anthropic SDK、Managed Agents\n- 加入／調整 caching、thinking、compaction、tool use、batch、files、citations、memory\n- 模型遷移（4.5 → 4.6 → 4.7、退役模型替換）\n\n❌ **不要**用於：`import openai`、檔名 `*-openai.py`、provider-neutral 程式碼。\n\n## 目錄結構速覽\n\n```\nskills/claude-api/\n├── SKILL.md                  # 路由與決策樹（~325 行）\n├── shared/                   # 跨語言共享文件\n│   ├── managed-agents-*.md   # 9 份 Managed Agents 文件\n│   ├── prompt-caching.md\n│   ├── tool-use-concepts.md\n│   ├── agent-design.md\n│   ├── model-migration.md    # 🌟 4.5→4.6→4.7 遷移指南\n│   ├── error-codes.md\n│   ├── models.md\n│   └── live-sources.md       # 🌟 官方 SDK repo URL 清單\n├── python/claude-api/        # Python 範例（streaming、tool-use、batches、files-api）\n├── typescript/claude-api/    # 同上\n├── java/、go/、ruby/、php/、csharp/、curl/    # 各語言實作\n└── managed-agents/           # 各語言的 Managed Agents 範例\n```\n\n## 核心觀念與工作流\n\n### Step 0: 語言偵測\n\n| 檔案類型 | 對應目錄 |\n|----------|----------|\n| `*.py`、`requirements.txt` | `python/` |\n| `*.ts`、`*.tsx`、`package.json` | `typescript/` |\n| `*.js`（無 `.ts`） | `typescript/` |\n| `*.java`、`*.kt`、`pom.xml` | `java/` |\n| `*.go` | `go/` |\n| `*.rb` | `ruby/` |\n| `*.cs` | `csharp/` |\n| `*.php` | `php/` |\n| 其他 / 純 shell | `curl/` |\n\n### Step 1: Surface 選擇\n\n| 任務 | Surface | 理由 |\n|------|---------|------|\n| 分類、摘要、抽取、Q&A | **單次 API call** | 最簡單 |\n| 批次處理、Embedding | **Claude API + Batches** | 專屬 endpoint |\n| 多步流程、自寫 loop | **API + Tool Use** | 你掌控 loop |\n| 開放式探索、agent 行為 | **Managed Agents** | 託管狀態 |\n\n### 預設值（除非使用者明說否則照這套）\n\n```python\nimport anthropic\nclient = anthropic.Anthropic()\n\nresponse = client.messages.create(\n    model=\"claude-opus-4-7\",                           # 預設最新最強模型\n    thinking={\"type\": \"adaptive\"},                      # 4.7 起推薦的 adaptive thinking\n    max_tokens=4096,\n    messages=[{\"role\": \"user\", \"content\": \"...\"}],\n)\n```\n\n任何長輸入、長輸出、或大 `max_tokens` 一律用 streaming：\n```python\nwith client.messages.stream(...) as stream:\n    final = stream.get_final_message()    # 不需要逐 chunk 處理時的便利方法\n```\n\n### Prompt Caching（必用）\n\n```python\nresponse = client.messages.create(\n    model=\"claude-opus-4-7\",\n    system=[\n        {\"type\": \"text\", \"text\": \"Long instructions ...\",\n         \"cache_control\": {\"type\": \"ephemeral\"}}        # 標記此區塊可被快取\n    ],\n    messages=[{\"role\": \"user\", \"content\": \"Question 1\"}],\n)\n```\n\n> 同一個 system prompt 重用多次時，從第二次起 cache hit，token 計費大幅折扣。詳見 `shared/prompt-caching.md`。\n\n### Managed Agents（4.7 新東西）\n\n關鍵概念：**Agent 是持久的（建一次→重複使用 ID），Session 才是短暫的**。\n\n```python\n# 一次性：建立 agent 並存下 ID\nagent = client.beta.agents.create(name=\"my-helper\", ...)\nagent_id = agent.id\n# ... 寫進 config\n\n# 每次互動：用 agent_id 開新 session\nsession = client.beta.agents.sessions.create(agent_id=agent_id, ...)\n```\n\n❌ 千萬不要在 request path 裡呼叫 `agents.create`。\n\n### 模型遷移\n\n| 升級 | 主要變化 |\n|------|----------|\n| 4.5 → 4.6 | Sonnet 4.6 大幅性能提升 |\n| 4.6 → 4.7 | `thinking={type: \"adaptive\"}` 取代 `budget_tokens`；新 Managed Agents |\n\n詳細對照表見 `shared/model-migration.md`。\n\n## 精華 Script 與可提取資源\n\n### 📚 `shared/live-sources.md`\n\n官方 SDK repo 的權威 URL 清單。**遇到不確定的 binding 時，先 WebFetch 此檔列出的 repo README**，不要憑感覺寫。\n\n### 📚 `shared/model-migration.md`\n\n跨版本升級的 cheat sheet——每個版本變了什麼參數、什麼方法被刪除、什麼推薦新做法。\n\n### 📚 `shared/managed-agents-*.md`（9 份）\n\n涵蓋 overview、core、tools、events、memory、client-patterns、onboarding、environments、api-reference。要用 Managed Agents 時，**這份文件比直接看 SDK 程式碼更系統化**。\n\n## 可移植到自家專案的模式\n\n1. **語言偵測表**：套用到任何「多語言 SDK 文件」場景。\n\n2. **Default-best 配置**：永遠用最新模型 + adaptive thinking + streaming + caching，把這 4 項當預設。\n\n3. **Agent ID 持久化**：把 LLM agent 視為 service object（建一次、長存），不要每次呼叫都重建。\n\n4. **不混用 SDK 與 raw HTTP**：在同一檔案裡選一個就堅持下去，避免 `requests.post` 與 `client.messages.create` 混用。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 在 OpenAI 程式碼裡硬塞 Anthropic SDK 呼叫 → skill 明文禁止；先問使用者要哪邊\n- ❌ 自己猜其他語言的 binding（從 cURL 形狀推 Java method）→ 一律 WebFetch 官方 README\n- ❌ `agents.create` 寫在 request handler 裡 → 每次請求都建新 agent，浪費資源\n- ❌ 預設 `thinking={\"type\": \"enabled\", \"budget_tokens\": 1024}` → 這是 4.6 寫法，4.7 用 `adaptive`\n- ❌ 長輸出不開 streaming → 容易 timeout\n\n## 延伸閱讀\n\n- 官方檔：[`skills/claude-api/SKILL.md`](../../skills/claude-api/SKILL.md)\n- 多語言子目錄：[`skills/claude-api/python/`](../../skills/claude-api/python/) 等\n- Managed Agents：[`skills/claude-api/shared/managed-agents-overview.md`](../../skills/claude-api/shared/managed-agents-overview.md)\n- 模型遷移：[`skills/claude-api/shared/model-migration.md`](../../skills/claude-api/shared/model-migration.md)\n- 官方 SDK：見 `shared/live-sources.md`\n"},{"path":"03-dev-technical-skills/frontend-design.md","title":"frontend-design — 反 AI slop 前端品味指南","content":"# frontend-design — 反 AI slop 前端品味指南\n\n## 一句話定位\n\n純粹的「設計思維 prompt」，沒有 script 也沒有元件——強迫 Claude 在寫前端前先選擇一個極端美學方向（10+ 種風格選一），避免「Inter + 紫漸層 + 全置中」的 AI 通用美學。\n\n## 何時觸發\n\n- 任何「建 web 元件／頁面／應用／landing page／dashboard」請求\n- 「美化這個 UI」、「重設計」\n- 不適用：純後端、無 UI 工作\n\n## 目錄結構速覽\n\n```\nskills/frontend-design/\n└── SKILL.md     # 唯一檔案（~85 行）— 純設計思維指南\n```\n\n## 核心觀念與工作流\n\n### Step 0: 設計思考（**寫程式之前**）\n\n用以下 4 題逼自己選定方向：\n\n1. **Purpose**：這 UI 解決什麼問題？誰用？\n2. **Tone**：選一個**極端**：\n   - brutally minimal（極簡野獸派）\n   - maximalist chaos（最大化混沌）\n   - retro-futuristic（復古未來）\n   - organic/natural（有機自然）\n   - luxury/refined（奢華精緻）\n   - playful/toy-like（玩具感）\n   - editorial/magazine（雜誌編排）\n   - brutalist/raw（粗野原始）\n   - art deco/geometric（裝飾藝術）\n   - soft/pastel（柔和粉彩）\n   - industrial/utilitarian（工業實用）\n3. **Constraints**：framework、效能、無障礙\n4. **Differentiation**：什麼讓這 UI 令人 **UNFORGETTABLE**？讓人記得的「那一點」是什麼？\n\n### 五大美學軸\n\n#### 1. Typography（字型）\n\n- **避免**：Arial、Inter、Roboto、system fonts\n- **追求**：獨特展示字 + 精緻內文字配對\n- 範例：Big Shoulders（粗壯）+ Crimson Pro（古典）\n\n#### 2. Color & Theme（色彩與主題）\n\n- 用 CSS variables 統一管理\n- **主色佔大面積 + sharp accents**，比「均勻分佈」有力\n- ❌ 避免紫漸層配白底（已成 AI 通病）\n\n#### 3. Motion（動態）\n\n- HTML：CSS-only（`@keyframes`、`transition`）\n- React：Motion library（前 framer-motion）\n- 重點：**少而精**——一次完美編排的 page load（staggered reveal）勝過 10 個零碎 micro-interaction\n- Hover、scroll-trigger 給驚喜\n\n#### 4. Spatial Composition（空間構圖）\n\n- **不對稱**、**斜流**、**重疊**、**破格**（grid-breaking）\n- 大量負空間 OR 受控密度\n- 不要永遠 max-width: 1200px 置中\n\n#### 5. Backgrounds & Details（背景與細節）\n\n- 別只用 solid color\n- 加：gradient mesh、noise texture、幾何 pattern、layered transparency、戲劇陰影、裝飾邊框、custom cursor、grain overlay\n\n### 核心原則\n\n> **Bold maximalism 與 refined minimalism 都行——關鍵是 intentionality（意圖性），不是 intensity（強度）**\n\n> **Match implementation complexity to the aesthetic vision**：極簡風格需要克制與精準（spacing、typography、subtle details）；最大化風格需要 elaborate code 與大量 effects。\n\n## 精華 Script 與可提取資源\n\n雖然沒有 script，但這份「avoid list」可直接抄到專案的 UI guidelines：\n\n### ❌ AI Slop 黑名單\n\n```\nNEVER use:\n- Inter / Roboto / Arial / system-ui\n- 紫漸層配白底（purple gradient on white）\n- 全置中 layout（重複 max-width: 1200px; mx-auto）\n- 統一 16px 圓角（uniform rounded-xl）\n- Stock illustration（cookie-cutter 插畫）\n- \"Sleek modern\" 通用形容詞\n- Space Grotesk（已被 AI 過度使用）\n```\n\n### ✅ 11 種美學方向選單\n\n把上面 11 種 tone 印成一張卡片，貼在牆上 / 加進 design system 文件。每次新專案抽一張，**強迫不重複**。\n\n## 可移植到自家專案的模式\n\n1. **「Pick an extreme tone」習慣**：別開會討論「要簡約還是現代」，直接從 11 種選一個極端。\n\n2. **CSS variables 主題系統**：\n   ```css\n   :root {\n     --color-primary: ...;\n     --color-accent-1: ...;\n     --color-accent-2: ...;\n     --font-display: ...;\n     --font-body: ...;\n   }\n   ```\n\n3. **One well-orchestrated moment > 10 micro-interactions**：把動畫預算集中在 page load 或關鍵互動，不要處處有效果。\n\n4. **Light/Dark + 字型 + 美學三維輪換**：團隊做多個產品時，刻意每次組合不同，避免「公司產品全長一樣」。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 沒選 tone 就開寫 → 默認 AI slop；✅ 強迫先選一個極端\n- ❌ Motion 用太多 → 視覺嘈雜；✅ 集中 1–2 個高影響時刻\n- ❌ Text 全置中 + 全白底 → 雜誌都不會這樣排；✅ 大膽留白／不對稱\n- ❌ 統一 `rounded-xl` → 缺少節奏；✅ 不同元件用不同邊角策略（鋒利／圓潤／半圓）\n- ❌ 把 minimalism 當作「省事的藉口」→ 變寡淡；✅ 極簡需要更精準的細節雕琢\n\n## 延伸閱讀\n\n- 官方檔：[`skills/frontend-design/SKILL.md`](../../skills/frontend-design/SKILL.md)\n- 配對閱讀：[web-artifacts-builder](./web-artifacts-builder.md)（實作層）\n- 相關靈感：[canvas-design](../02-creative-skills/canvas-design.md)（設計宣言模式）\n"},{"path":"03-dev-technical-skills/mcp-builder.md","title":"mcp-builder — MCP Server 開發指南","content":"# mcp-builder — MCP Server 開發指南\n\n## 一句話定位\n\n把「為 LLM 寫 MCP server」拆成 4 個 phase（研究 → 實作 → 審查 → 評估），預設 TypeScript + Streamable HTTP，內建 10 題 Q&A 評估框架。\n\n## 何時觸發\n\n- 建立 MCP server，整合外部 API／服務\n- 用 Python（FastMCP）或 Node/TypeScript（MCP SDK）\n- 包裝公司內部服務給 Claude／其他 LLM 使用\n\n## 目錄結構速覽\n\n```\nskills/mcp-builder/\n├── SKILL.md                      # 4 phase 工作流\n├── scripts/\n│   ├── connections.py            # API client 測試輔助\n│   ├── evaluation.py             # 跑 Q&A 評估\n│   ├── example_evaluation.xml    # 評估格式範本\n│   └── requirements.txt\n└── reference/\n    ├── mcp_best_practices.md     # 命名、傳輸、分頁、錯誤處理規範\n    ├── node_mcp_server.md        # 🌟 TypeScript SDK + Zod 完整範例（~550 行）\n    ├── python_mcp_server.md      # 🌟 FastMCP + Pydantic 完整範例（~550 行）\n    └── evaluation.md             # 評估設計指南\n```\n\n## 核心觀念與工作流\n\n### 4 Phase 工作流\n\n#### Phase 1: 研究與規劃\n\n- 讀 MCP spec：`https://modelcontextprotocol.io/sitemap.xml` → 加 `.md` 後綴抓 markdown\n- 讀目標服務的 API 文件\n- 推薦 stack：**TypeScript + Streamable HTTP**（無狀態 JSON）\n\n#### Phase 2: 實作\n\n**專案結構**（見 `reference/node_mcp_server.md` 或 `python_mcp_server.md` 完整範例）：\n- 共享 utilities：API client + auth、錯誤處理、回應格式化、分頁\n- 每個 tool 用 Zod（TS）或 Pydantic（Py）定義 input/output schema\n\n```typescript\n// TypeScript with Zod\nserver.registerTool({\n  name: \"github_create_issue\",\n  description: \"Create a GitHub issue.\",\n  inputSchema: z.object({\n    repo: z.string().describe(\"Format: owner/name\"),\n    title: z.string(),\n    body: z.string().optional(),\n  }),\n  outputSchema: z.object({\n    number: z.number(),\n    url: z.string(),\n  }),\n  annotations: { destructiveHint: false, idempotentHint: false },\n}, async (input) => { /* ... */ });\n```\n\n#### Phase 3: 審查與測試\n\n- DRY 原則、一致的錯誤處理、完整 type 覆蓋\n- TypeScript：`npm run build`、`npx @modelcontextprotocol/inspector`\n- Python：`python -m py_compile`、用 MCP Inspector 互動測試\n\n#### Phase 4: 建立評估\n\n寫 **10 個 Q&A pair**，每題要：\n- ✅ Independent（不依賴前題）\n- ✅ Read-only（不變更資料）\n- ✅ Complex（需多次工具呼叫）\n- ✅ Realistic（真實使用情境）\n- ✅ Verifiable（單一明確答案）\n- ✅ Stable（答案不會隨時間變）\n\nXML 格式：\n```xml\n<evaluation>\n  <qa_pair>\n    <question>找出含 ASL-X 安全標示的 AI 模型討論，名字像「斑點野貓」的模型其 X 值為何？</question>\n    <answer>3</answer>\n  </qa_pair>\n</evaluation>\n```\n\n## 精華 Script 與可提取資源\n\n### 🔧 `scripts/evaluation.py`\n\n跑 XML 中的 Q&A，把答案餵給有 MCP server 的 Claude，比對結果並給分數。**這是「客觀衡量 LLM 工具品質」的範本**——你做任何 dev tool 都該有類似評估。\n\n### 📚 `reference/mcp_best_practices.md`\n\n精華規範清單：\n- 工具命名：`{service}_{action}_{resource}` 例如 `github_list_repos`\n- 回應格式：JSON 給結構化、Markdown 給給人類閱讀\n- 分頁預設 limit；超過用 `next_token` cursor\n- 傳輸：本地 stdio、遠端 streamable HTTP（無狀態優先）\n\n### 📚 `reference/node_mcp_server.md` & `python_mcp_server.md`\n\n**~550 行的完整範例**，從 `package.json` 到實際 tool function 都有，能直接拷貝為起點。\n\n## 可移植到自家專案的模式\n\n1. **4-Phase 流程**（研究 → 實作 → 審查 → 評估）：套用到任何「為 LLM 設計 API」的工作。\n\n2. **Tool 命名規範**：在自家工具集統一 `{service}_{action}_{resource}`，提升 LLM 找到正確工具的機率。\n\n3. **Annotation 標籤**：\n   ```\n   readOnlyHint: true        # 不會改資料\n   destructiveHint: true     # 會刪除東西\n   idempotentHint: true      # 多次呼叫結果一致\n   openWorldHint: true       # 與外部世界互動（網路）\n   ```\n   這 4 個布林值幫助 LLM 決定何時可以放心呼叫。\n\n4. **Actionable 錯誤訊息**：別只寫 `\"Error: 404\"`，要寫 `\"Issue #123 not found in repo X. Use github_list_issues to find existing IDs.\"`。\n\n5. **10 題 Q&A 評估**：任何工具集都該有客觀題庫，避免「LLM 看起來會用了」這種主觀判斷。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 工具名混用 camelCase / snake_case → LLM 困惑；✅ 一致命名\n- ❌ 把全部 API 端點都包成 tool → context 爆炸；✅ 包常用的 + 預留 `code execution`\n- ❌ 回應只丟整顆 JSON → token 浪費；✅ 預設只回必要欄位、加 `?fields=` 參數\n- ❌ 沒寫 evaluation.xml → 不知道改動有沒有變更好；✅ 一定要建立 baseline\n- ❌ 把 stateful session 用在 streamable HTTP server → 難 scale；✅ 預設無狀態 JSON\n\n## 延伸閱讀\n\n- 官方檔：[`skills/mcp-builder/SKILL.md`](../../skills/mcp-builder/SKILL.md)\n- TypeScript 範例：[`skills/mcp-builder/reference/node_mcp_server.md`](../../skills/mcp-builder/reference/node_mcp_server.md)\n- Python 範例：[`skills/mcp-builder/reference/python_mcp_server.md`](../../skills/mcp-builder/reference/python_mcp_server.md)\n- 評估指南：[`skills/mcp-builder/reference/evaluation.md`](../../skills/mcp-builder/reference/evaluation.md)\n- MCP 官方規範：<https://modelcontextprotocol.io/sitemap.xml>\n"},{"path":"03-dev-technical-skills/skill-creator.md","title":"skill-creator — 寫 Skill 的 Skill（Meta）","content":"# skill-creator — 寫 Skill 的 Skill（Meta）\n\n## 一句話定位\n\n製作、評估、最佳化 skill 本身的 meta-skill。提供完整的「draft → 評估 → 迭代 → 描述優化」迴圈，含 grader/comparator/analyzer 三個 subagent 與 React-based 評估檢視器。\n\n## 何時觸發\n\n- 「我想做一個 skill 來幫我...」\n- 已有 skill 草稿、要跑評估\n- 想優化 skill 的 description 觸發準確率\n- benchmark 多個 skill 版本比較\n\n## 目錄結構速覽\n\n```\nskills/skill-creator/\n├── SKILL.md                # 完整迭代迴圈（~486 行）\n├── scripts/\n│   ├── aggregate_benchmark.py   # 合併多次跑分為 benchmark.json\n│   ├── run_loop.py              # 🌟 描述優化迴圈（5 輪 60/40 分割）\n│   ├── run_eval.py              # 觸發單次評估\n│   ├── generate_report.py       # 產 HTML 報表\n│   ├── package_skill.py         # 打包成 .skill 檔\n│   ├── quick_validate.py        # 語法 sanity check\n│   ├── improve_description.py   # 單次描述修訂\n│   └── utils.py\n├── agents/                  # subagent 提示\n│   ├── grader.md            # 評分員：assertion 對輸出\n│   ├── comparator.md        # 比對員：盲測 A/B\n│   └── analyzer.md          # 分析員：找 outlier、無辨識度的 assertion\n├── eval-viewer/             # 瀏覽器評估檢視器\n│   ├── generate_review.py\n│   └── viewer.html          # 🌟 React-based 比較介面\n├── references/\n│   └── schemas.md           # evals.json 等 schema 參考\n└── assets/\n    └── eval_review.html     # 互動式 query 編輯模板\n```\n\n## 核心觀念與工作流\n\n### 完整迴圈\n\n```\n意圖捕捉 → 草稿 SKILL.md → 撰寫測試 → 跑評估 → 看結果 →\n   ↓                                                ↓\n   ←—————————— 修改 SKILL.md ←——————————————————————\n                    ↓\n              描述優化（run_loop.py）\n                    ↓\n                打包 .skill\n```\n\n### Step 1: 意圖捕捉（4 題訪談）\n\n```\n1. 這個 skill 應該讓 Claude 做什麼？\n2. 何時該觸發？（user 的什麼話／情境）\n3. 期望輸出格式？\n4. 要不要建測試？（客觀可驗證的→建議要；主觀如寫作/藝術→可選）\n```\n\n### Step 2: 寫 SKILL.md\n\n關鍵建議（直接抄）：\n- **description 寫得「有點 pushy」**：因為 Claude 傾向 undertrigger\n- 反例：`How to build a dashboard.`\n- 正例：`How to build a dashboard. Make sure to use this skill whenever the user mentions dashboards, data visualization, internal metrics, or wants to display any kind of company data, even if they don't explicitly ask for a 'dashboard.'`\n\n### Step 3: 評估架構\n\n**並行跑兩組 subagent**：\n- **with-skill**：載入此 skill\n- **baseline**：沒有 skill\n\n每個輸出由 `agents/grader.md` 配方的評分員針對 assertion 評分，產出：\n```json\n{\n  \"assertions\": [\n    {\"text\": \"輸出包含 TOC\", \"passed\": true, \"evidence\": \"見第 3 行\"},\n    {\"text\": \"使用 #FF0000 色碼\", \"passed\": false, \"evidence\": \"用了 #FF1234\"}\n  ]\n}\n```\n\n### Step 4: Benchmark\n\n`aggregate_benchmark.py` 對多次 run 取統計：\n- pass_rate ± stddev\n- token usage delta（vs baseline）\n- time delta\n- 分析員觀察（見 `agents/analyzer.md`）\n\n### Step 5: 描述優化迴圈（殺手鐧）\n\n`run_loop.py` 自動跑：\n1. 把 trigger eval 切 60/40（train/test）\n2. 對當前 description 跑 3 次，量觸發準確率\n3. 用 `improve_description.py` 提出修改版本\n4. 重新評估\n5. 重複 5 輪，挑 test set 表現最好的版本\n\n**準備材料**：\n- 8–10 個「該觸發」的 query（positive）\n- 8–10 個「不該觸發但接近」的 query（near-miss negative）\n\n## 精華 Script 與可提取資源\n\n### 🌟 `scripts/run_loop.py`（必看）\n\n封裝完整的「LLM-as-judge + 反覆迭代」框架。可挪用到任何「想自動優化 prompt」的場景：A/B 測試 prompt → 評分 → 用另一個 LLM 提改進 → 重跑。\n\n### 🌟 `eval-viewer/viewer.html`\n\nReact-based 比較介面，分頁顯示：\n- **Outputs tab**：每個 eval 的 with-skill / baseline 並列\n- **Benchmark tab**：統計圖表（pass_rate、token、time）\n- 內建 user feedback 收集\n\n> 📍 **可挪用**：任何「需要肉眼比對 LLM 輸出」的場景都可以複製這個 viewer。\n\n### 🌟 `agents/grader.md`、`comparator.md`、`analyzer.md`\n\n3 個 subagent 提示詞範本：\n- **grader**：給定 assertion + output，判 passed 並給 evidence\n- **comparator**：盲測 A/B，給出哪個更好 + 理由\n- **analyzer**：看完一輪 benchmark，找出無辨識度的 assertion（不管哪個版本都通過＝無價值）\n\n### 🔧 `scripts/package_skill.py`\n\n把整個 skill 資料夾打包成 `.skill` 分發檔。\n\n## 可移植到自家專案的模式\n\n1. **「Description 寫得 pushy」**：自家工具的描述也別客氣，明確列舉觸發情境。\n\n2. **Trigger Eval（pos + near-miss）**：寫 8 個「該用」+ 8 個「不該用」query 是測試任何 router／classifier 的好方法。\n\n3. **Subagent 評分架構**：把「執行任務的 agent」與「評分的 agent」分開，避免自我評估偏誤。\n\n4. **Schema 標準化**（見 `references/schemas.md`）：\n   - `evals.json`：題目庫\n   - `grading.json`：每次評分結果\n   - `benchmark.json`：跨多次 run 的統計\n\n5. **HTML viewer 複製**：把 `viewer.html` 改成你自己工具的結果檢視器，不必每次重寫。\n\n## 常見陷阱（Gotchas）\n\n- ❌ description 寫太短／含糊 → undertrigger；✅ 列具體 trigger 字眼\n- ❌ assertion 太籠統（\"輸出要好\"）→ 沒辨識度；✅ 「包含特定字串/格式」\n- ❌ 只跑一次評估就下結論 → variance 大；✅ 跑 ≥ 3 次取平均\n- ❌ 沒準備 near-miss negatives → 描述會 overtrigger；✅ 8 個負例不能省\n- ❌ 把 grader 用同個對話 context 評分 → 偏誤；✅ 用獨立 subagent\n\n## 延伸閱讀\n\n- 官方檔：[`skills/skill-creator/SKILL.md`](../../skills/skill-creator/SKILL.md)\n- 描述優化迴圈：[`skills/skill-creator/scripts/run_loop.py`](../../skills/skill-creator/scripts/run_loop.py)\n- Schema 參考：[`skills/skill-creator/references/schemas.md`](../../skills/skill-creator/references/schemas.md)\n- Subagent 提示：[`skills/skill-creator/agents/`](../../skills/skill-creator/agents/)\n- 評估檢視器：[`skills/skill-creator/eval-viewer/viewer.html`](../../skills/skill-creator/eval-viewer/viewer.html)\n"},{"path":"03-dev-technical-skills/web-artifacts-builder.md","title":"web-artifacts-builder — React + shadcn artifact 製作器","content":"# web-artifacts-builder — React + shadcn artifact 製作器\n\n## 一句話定位\n\n把「複雜的 React + Tailwind + shadcn/ui artifact」一鍵 init／一鍵 bundle 成單檔 HTML，可貼進 Claude 對話分享；內附 40+ 預裝 shadcn/ui 元件。\n\n## 何時觸發\n\n- 建立**複雜**的 Claude.ai artifact（含狀態管理、routing、shadcn 元件）\n- 不適用：簡單單檔 HTML/JSX artifact（直接寫即可）\n\n## 目錄結構速覽\n\n```\nskills/web-artifacts-builder/\n├── SKILL.md                        # 4 步驟工作流（~75 行）\n└── scripts/\n    ├── init-artifact.sh            # 🌟 React 專案初始化\n    ├── bundle-artifact.sh          # 🌟 打包成單檔 HTML\n    └── shadcn-components.tar.gz    # 40+ 預裝元件\n```\n\n## 核心觀念與工作流\n\n### 4 步驟\n\n```bash\n# Step 1: 初始化\nbash scripts/init-artifact.sh my-artifact\ncd my-artifact\n\n# Step 2: 開發（編輯生成的檔案）\nnpm run dev\n\n# Step 3: 打包成單檔 HTML\nbash scripts/bundle-artifact.sh\n# 產出 bundle.html — 自含所有 JS/CSS\n\n# Step 4: 把 bundle.html 內容貼進 Claude 對話即可分享\n```\n\n### Stack 組成\n\n| 層 | 工具 |\n|-----|------|\n| Framework | React 18 + TypeScript |\n| Dev Server | Vite |\n| Bundler | Parcel + html-inline |\n| 樣式 | Tailwind CSS 3.4.1 |\n| UI 元件 | shadcn/ui（40+ 預裝） |\n| Path alias | `@/` |\n\n### init-artifact.sh 做了什麼\n\n- 偵測 Node 版本，自動 pin 對應 Vite 版本（Node 18+ 相容）\n- 檢查 pnpm（有就用、無則 npm）\n- 解壓 `shadcn-components.tar.gz` 進 `src/components/ui/`\n- 產 `tailwind.config.js`、`tsconfig.json`、`vite.config.ts`、`.parcelrc`\n\n### bundle-artifact.sh 做了什麼\n\n- 安裝 `parcel`、`@parcel/config-default`、`parcel-resolver-tspaths`、`html-inline`\n- 產 `.parcelrc`（含路徑別名解析）\n- Parcel build（不出 source map）\n- `html-inline` 把所有 `<script>` 與 `<link>` inline 進 HTML\n- 輸出 `bundle.html`\n\n## 精華 Script 與可提取資源\n\n### 🌟 `scripts/init-artifact.sh`\n\n`Vite + React + TS + Tailwind + shadcn` 一鍵 scaffold。對任何快速啟動 React 專案的場景都有用，不限於 Claude artifact。\n\n關鍵亮點：\n```bash\n# Node 版本偵測 + Vite 版本 pinning\nNODE_MAJOR=$(node -v | cut -d. -f1 | sed 's/v//')\nif [ \"$NODE_MAJOR\" -lt 20 ]; then\n  VITE_VERSION=\"^5\"      # Node 18 用 Vite 5\nelse\n  VITE_VERSION=\"^6\"      # Node 20+ 用 Vite 6\nfi\n```\n\n### 🌟 `scripts/bundle-artifact.sh`\n\n把 SPA 打成「自帶所有依賴的單檔 HTML」。**對任何「要把 web app 用 email/Slack 分享」的情境都極有用**。\n\n### 🌟 `shadcn-components.tar.gz`\n\n預裝 40+ shadcn/ui 元件 + Radix UI deps。免去 `shadcn-ui add ...` 一個個跑。\n\n> 📍 **解壓出來放自家專案**，立即得到完整 shadcn 元件庫。\n\n## 可移植到自家專案的模式\n\n1. **`init-artifact.sh` 改造**：把 init script 套用到自家 boilerplate（公司內部專案、template repo）。\n\n2. **單檔 HTML 分享思路**：bundle-artifact.sh 的「Parcel + html-inline」組合可解決「不部署也能分享」的需求——做 demo、教學、portfolio。\n\n3. **Node 版本偵測 + 版本 pinning**：Bash script 範例可抄。\n\n4. **預裝元件 tarball**：當你有一組常用 dependency，包成 tarball + script 解壓比 npm install 快上百倍。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 簡單 artifact 也用此流程 → 過度工程；✅ 簡單的就直接 inline HTML\n- ❌ Bundle 後沒測 → bundle.html 可能含 dev-only 路徑；✅ 自己開瀏覽器看\n- ❌ 用 Inter / 紫漸層 / 圓角 16px → AI slop；✅ 看下面[frontend-design](./frontend-design.md)避雷\n- ❌ 把 bundle.html 直接 commit → 檔案太大；✅ gitignore，只 commit src\n\n## 延伸閱讀\n\n- 官方檔：[`skills/web-artifacts-builder/SKILL.md`](../../skills/web-artifacts-builder/SKILL.md)\n- init 腳本：[`skills/web-artifacts-builder/scripts/init-artifact.sh`](../../skills/web-artifacts-builder/scripts/init-artifact.sh)\n- bundle 腳本：[`skills/web-artifacts-builder/scripts/bundle-artifact.sh`](../../skills/web-artifacts-builder/scripts/bundle-artifact.sh)\n- 配對閱讀：[frontend-design](./frontend-design.md)（避免 AI slop 美學）\n- shadcn/ui 文件：<https://ui.shadcn.com/docs/components>\n"},{"path":"03-dev-technical-skills/webapp-testing.md","title":"webapp-testing — Playwright 自動化測試","content":"# webapp-testing — Playwright 自動化測試\n\n## 一句話定位\n\n用 Playwright 測試本地 web app（靜態 HTML 或動態 server-rendered），核心提供 `with_server.py` 多伺服器生命週期管理 + reconnaissance-then-action 互動模式。\n\n## 何時觸發\n\n- 驗證前端功能、debug UI 行為\n- 截圖、看 browser console log\n- 對 localhost web app 做自動化操作\n\n## 目錄結構速覽\n\n```\nskills/webapp-testing/\n├── SKILL.md                       # 決策樹 + pattern\n├── scripts/\n│   └── with_server.py             # 🌟 多 server 生命週期管理\n└── examples/\n    ├── static_html_automation.py  # file:// URL 模式\n    ├── element_discovery.py       # 元素搜尋策略\n    └── console_logging.py         # 抓 browser log\n```\n\n## 核心觀念與工作流\n\n### 決策樹\n\n```\n是否為靜態 HTML？\n├─ 是 → 直接讀 HTML 找 selector → 寫 Playwright script\n│\n└─ 否（動態 webapp） → server 已啟動？\n    ├─ 否 → 用 with_server.py\n    └─ 是 → reconnaissance-then-action：\n        1. goto + 等 networkidle\n        2. 截圖 / 看 DOM\n        3. 從渲染後的 DOM 找 selector\n        4. 執行操作\n```\n\n### Reconnaissance-then-Action（核心模式）\n\n```python\nfrom playwright.sync_api import sync_playwright\n\nwith sync_playwright() as p:\n    browser = p.chromium.launch(headless=True)        # 一律 headless\n    page = browser.new_page()\n    page.goto('http://localhost:5173')\n    page.wait_for_load_state('networkidle')           # ← 重要！\n\n    # 偵察階段\n    page.screenshot(path='/tmp/inspect.png', full_page=True)\n    print(page.content()[:2000])\n    buttons = page.locator('button').all()\n\n    # 行動階段（已知 selector 後才下手）\n    page.locator('text=Submit').click()\n    browser.close()\n```\n\n### with_server.py 用法\n\n**單 server**：\n```bash\npython scripts/with_server.py \\\n  --server \"npm run dev\" --port 5173 \\\n  -- python my_test.py\n```\n\n**多 server**（前後端同時跑）：\n```bash\npython scripts/with_server.py \\\n  --server \"cd backend && python server.py\" --port 3000 \\\n  --server \"cd frontend && npm run dev\" --port 5173 \\\n  -- python my_test.py\n```\n\n腳本邏輯：\n1. 平行啟動所有 server\n2. 輪詢 port 直到 ready（30s timeout）\n3. 跑 `--` 之後的命令\n4. 結束時清理所有 server process\n\n## 精華 Script 與可提取資源\n\n### 🌟 `scripts/with_server.py`（極具重用價值）\n\n**這支 ~50 行的腳本能套用到任何「測試需要 server 先跑起來」的情境**——CI 整合、E2E 測試、資料庫＋API＋前端三層啟動。\n\n直接複製即可，無依賴。\n\n### 📋 黑盒呼叫原則\n\n> **Always run scripts with `--help` first. DO NOT read the source until you try running the script first.**\n\n這是 Anthropic 官方的設計哲學：scripts 是黑盒 CLI 工具，不是要被讀進 context 的程式碼。看 `--help`、用、不要讀源碼。\n\n### 📋 元素定位策略（從 `element_discovery.py`）\n\n```python\npage.locator('text=Submit')           # 文字\npage.locator('role=button[name=\"OK\"]') # ARIA role\npage.locator('.btn-primary')           # CSS class\npage.locator('#submit-btn')            # ID\npage.locator('xpath=//button[1]')      # XPath（最後手段）\n```\n\n優先順序：text > role > css > xpath。\n\n## 可移植到自家專案的模式\n\n1. **`with_server.py` 直接抄**：CI 跑 E2E、本地 dev 多服務啟動，都能用。\n\n2. **Reconnaissance-then-Action 心法**：任何不確定的環境（陌生 API、未知 DOM、新平台），先「看清楚」再「動手」。\n\n3. **`networkidle` 等待**：很多 SPA 一上 load 就 fire 還沒就緒；wait for networkidle 是最簡單的等就緒方式。\n\n4. **Black-box script 哲學**：自家 CLI 工具寫好 `--help`，不要強迫使用者（或 Claude）讀原始碼。\n\n5. **Headless 預設**：自動化測試永遠 headless，省記憶體並可在 CI 跑。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 沒等 `networkidle` 就 inspect → SPA 還沒掛載 component；✅ 一定要等\n- ❌ 寫 `xpath=//div[3]/button[1]` → 改版易壞；✅ 用 text/role\n- ❌ 忘記 `browser.close()` → process leak\n- ❌ 把 server 啟動寫在 test script 內 → 失敗時清不乾淨；✅ 用 `with_server.py`\n- ❌ headless=False 跑 CI → 沒有顯示器，crash\n- ❌ 把 with_server.py 整檔讀進 context → 純粹浪費 token；✅ `--help` 即可\n\n## 延伸閱讀\n\n- 官方檔：[`skills/webapp-testing/SKILL.md`](../../skills/webapp-testing/SKILL.md)\n- 主要腳本：[`skills/webapp-testing/scripts/with_server.py`](../../skills/webapp-testing/scripts/with_server.py)\n- 範例集：[`skills/webapp-testing/examples/`](../../skills/webapp-testing/examples/)\n"},{"path":"04-enterprise-skills/README.md","title":"企業溝通類 Skills","content":"# 企業溝通類 Skills\n\n這 3 個 skills 處理「公司內部標準化輸出」——從文字（內部溝通）到視覺（品牌與主題），是 enterprise 場景最常用的能力。\n\n| Skill | 解決問題 | 主要資產 |\n|-------|----------|----------|\n| [internal-comms](./internal-comms.md) | 各種內部溝通文件範本 | 4 份格式指南 |\n| [brand-guidelines](./brand-guidelines.md) | 套用 Anthropic 品牌色與字型 | 7 色 + 2 字型規範 |\n| [theme-factory](./theme-factory.md) | 10 套預設主題 + 客製主題 | 10 個 .md 主題定義 + 視覺 PDF |\n\n## 共通設計模式\n\n### 1. Examples / Themes 資料夾的「複數選擇」結構\n\n3 個 skills 都把「多種選項」放在子資料夾各成一檔：\n- `internal-comms/examples/` 裡放 4 種文件類型範本\n- `theme-factory/themes/` 裡放 10 套主題\n\n**好處**：Claude 可依使用者選擇只載入相關檔案，省 context。\n\n### 2. 視覺索引（PDF showcase）\n\n`theme-factory/theme-showcase.pdf` 是給人類看的、不給 Claude 改的視覺索引。\n\n> 套用啟示：當你的工具有「視覺差異性高」的選項時，做一張 showcase 比寫 100 行描述更有效。\n\n### 3. Brand-as-Skill 模式\n\n`brand-guidelines` 完全是「規範文件」型 skill——沒有 script、沒有 examples，只有色碼與字型指示。但因為 Claude 會把這份規範當「執行指令」遵循，**比一般 brand book PDF 更可被 enforce**。\n\n## 推薦學習順序\n\n1. **internal-comms** — 學「example-based」skill 怎麼寫\n2. **theme-factory** — 學「多選項 + 視覺 showcase」怎麼組織\n3. **brand-guidelines** — 學「pure-instruction」型 skill 的極簡形態\n"},{"path":"04-enterprise-skills/brand-guidelines.md","title":"brand-guidelines — Anthropic 品牌規範","content":"# brand-guidelines — Anthropic 品牌規範\n\n## 一句話定位\n\n最簡潔的 skill 之一——只列出 Anthropic 的 7 種品牌色 + 2 種字型，當 Claude 偵測到「需要套品牌」時自動套用。是「pure-instruction」型 skill 的範本。\n\n## 何時觸發\n\n- 套用品牌色、企業視覺識別、視覺格式化、公司設計標準\n- 「apply Anthropic brand styling」、「make it look corporate」\n\n## 目錄結構速覽\n\n```\nskills/brand-guidelines/\n├── SKILL.md      # 唯一檔案（~75 行）— 純規範\n└── LICENSE.txt\n```\n\n> **沒有 script、沒有 example、沒有 asset**。極簡 skill 的代表。\n\n## 核心觀念與工作流\n\n### Anthropic 品牌色（7 色）\n\n#### 主色調（4 色）\n\n| 角色 | Hex | 用途 |\n|------|-----|------|\n| **Dark** | `#141413` | 主要文字、深色背景 |\n| **Light** | `#faf9f5` | 淺色背景、深色上的文字 |\n| **Mid Gray** | `#b0aea5` | 次要元素 |\n| **Light Gray** | `#e8e6dc` | 細微背景 |\n\n#### 強調色（3 色）\n\n| 角色 | Hex | 用途 |\n|------|-----|------|\n| **Orange** | `#d97757` | 主要強調 |\n| **Blue** | `#6a9bcc` | 次要強調 |\n| **Green** | `#788c5d` | 第三強調 |\n\n### 字型配對\n\n| 用途 | 字型 | Fallback |\n|------|------|----------|\n| **標題（24pt+）** | Poppins | Arial |\n| **內文** | Lora | Georgia |\n\n### 套用規則\n\n- 字型：標題 ≥ 24pt 用 Poppins，其餘用 Lora\n- 沒裝字型 → 自動退回 Arial / Georgia（不阻擋輸出）\n- 形狀／非文字元素：循環使用 Orange → Blue → Green\n- 文字顏色根據背景對比智慧選擇\n\n### 技術細節\n\n```python\nfrom pptx.dml.color import RGBColor\n\nORANGE = RGBColor(0xd9, 0x77, 0x57)\nBLUE   = RGBColor(0x6a, 0x9b, 0xcc)\nGREEN  = RGBColor(0x78, 0x8c, 0x5d)\n\nshape.fill.solid()\nshape.fill.fore_color.rgb = ORANGE\n```\n\n## 精華 Script 與可提取資源\n\n### 📋 7 色 hex 表\n\n直接複製到自家專案的 `theme.css`：\n\n```css\n:root {\n  /* Main */\n  --brand-dark: #141413;\n  --brand-light: #faf9f5;\n  --brand-mid-gray: #b0aea5;\n  --brand-light-gray: #e8e6dc;\n\n  /* Accent */\n  --brand-orange: #d97757;\n  --brand-blue: #6a9bcc;\n  --brand-green: #788c5d;\n}\n```\n\n### 📋 Poppins + Lora 字型搭配\n\n兩者皆免費（Google Fonts），可直接：\n```html\n<link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Lora&display=swap\" rel=\"stylesheet\">\n```\n\n> 配對哲學：Poppins（無襯線、現代、結構感）對比 Lora（襯線、古典、人文感）——典型「現代 vs 古典」對比配對法。\n\n## 可移植到自家專案的模式\n\n1. **「Pure Instruction」skill 模板**：當你只有規範要傳達、沒有複雜流程，就學這支——SKILL.md 寫清楚規則即可，不必硬塞 script。\n\n2. **Smart Fallback 思維**：字型沒裝就 fallback、不阻擋輸出。任何依賴外部資源的工具都該有 fallback。\n\n3. **Accent Cycle**：3 色循環使用，比「全用 orange」有層次。可推廣到 chart 配色：循環 N 色而不重複。\n\n4. **24pt 為標題分界**：簡單明確的數字規則，比「heading 比 body 大」這種模糊規則容易執行。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 強迫使用者裝 Poppins / Lora → 阻擋；✅ 預設 fallback Arial/Georgia\n- ❌ 把全部元素都用 Orange → 失去層次；✅ 主色＋3 種 accent 循環\n- ❌ Mid Gray (#b0aea5) 當主要文字色 → 對比不足；✅ 主文用 Dark\n- ❌ 套品牌套到失去內容識別度 → 過度品牌化\n\n## 延伸閱讀\n\n- 官方檔：[`skills/brand-guidelines/SKILL.md`](../../skills/brand-guidelines/SKILL.md)\n- 配對閱讀：[theme-factory](./theme-factory.md)（10 種其他主題）、[canvas-design](../02-creative-skills/canvas-design.md)（更廣的視覺設計）\n"},{"path":"04-enterprise-skills/internal-comms.md","title":"internal-comms — 公司內部溝通文件樣板","content":"# internal-comms — 公司內部溝通文件樣板\n\n## 一句話定位\n\n把「內部溝通」拆成 4 種常見類型（3P 更新／週報／FAQ／一般），每種放一份格式指南到 `examples/` 資料夾，Claude 依使用者請求載入對應檔案。\n\n## 何時觸發\n\n- \"幫我寫狀態報告\"、\"draft a leadership update\"、\"3P update\"\n- 公司週報（newsletter）、FAQ、事件報告（incident report）\n- 任何「內部溝通」相關文件\n\n## 目錄結構速覽\n\n```\nskills/internal-comms/\n├── SKILL.md\n├── LICENSE.txt\n└── examples/\n    ├── 3p-updates.md          # Progress / Plans / Problems 團隊週報\n    ├── company-newsletter.md  # 公司週報\n    ├── faq-answers.md         # FAQ 撰寫\n    └── general-comms.md       # 其他類型（fallback）\n```\n\n## 核心觀念與工作流\n\n### Skill 主流程（從 SKILL.md）\n\n```\n1. 從使用者請求判斷溝通類型\n2. 載入 examples/ 內對應的 .md 指南\n3. 依指南指示蒐集資訊、撰寫、格式化\n4. 若不符合任何類型 → 詢問使用者期望格式\n```\n\n### 4 種文件類型\n\n#### 1️⃣ 3P Updates（Progress / Plans / Problems）\n\n- 適用：團隊週報、跨部門更新、scrum 周會輸出\n- 風格：30–60 秒讀完的執行摘要\n- 格式：emoji 開頭 + 團隊名 + 三段式\n- 數據優先：用具體數字而非「進展順利」這種模糊用語\n\n#### 2️⃣ Company Newsletter（公司週報）\n\n- 適用：全公司週報、月報\n- 結構：20–25 個 bullet，分區（Announcements / Progress / Leadership）\n- 語氣：用 \"we\" 第一人稱複數\n- 整合連結：Slack thread、Drive 文件、email 串、行事曆\n\n#### 3️⃣ FAQ Answers\n\n- 適用：對全公司常見疑惑的官方回答\n- 結構：Q-A pair，根據實際 Slack/email/文件中觀察到的疑問\n- 不要編造問題——必須是真有人問過\n\n#### 4️⃣ General Comms（fallback）\n\n未明確指定格式時的備用，會反問使用者目標、受眾、長度期望。\n\n## 精華 Script 與可提取資源\n\n雖然沒有 script，但 4 份範本檔本身就是極具參考價值的格式知識：\n\n### 📋 套用到自家專案的「example-based skill」結構\n\n```\nmy-skill/\n├── SKILL.md      # 路由：判斷類型 → 載入對應 example\n└── examples/\n    ├── type-a.md\n    ├── type-b.md\n    └── fallback.md\n```\n\n當你的 skill 處理「多種子類型」（如不同類型的報告、不同程式語言、不同產業客戶），這個結構讓 Claude 只載入相關的，省 context、不混淆。\n\n### 📋 資訊整合策略\n\n`internal-comms` 預設 Claude 應主動詢問可否取得：\n- Slack 訊息與 thread\n- Google Drive 文件\n- email 串\n- Calendar 事件\n\n這個「source-gathering checklist」可以套用到任何「總結散落資訊」的工具。\n\n## 可移植到自家專案的模式\n\n1. **Type Router 模式**：SKILL.md 當 router、examples 當 handler——這是非常可推廣的 skill 設計模式。\n\n2. **「30–60 秒讀完」的限制**：把 3P update 限制在這個時間內，強迫精煉。可推廣到所有寫作任務的 budget 概念。\n\n3. **數字 > 形容詞**：別寫「進度良好」，寫「完成 8/10 sprint stories」。\n\n4. **第一人稱複數 \"we\"**：公司溝通用 we，不用 I 也不用第三人稱。\n\n5. **只 quote 真實問題**：FAQ 的 Q 必須有人真的問過，避免 strawman。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 寫成「萬字長文」報告 → 沒人讀；✅ 60 秒可掃完\n- ❌ 「進展順利、團隊努力」這種空話 → 沒資訊；✅ 用數字或具體事件\n- ❌ 一個 newsletter 涵蓋所有事 → 重點稀釋；✅ 分節 + 每節 5–7 點\n- ❌ FAQ 自己造問題 → 戰略稻草人；✅ 從 Slack 找實際對話\n- ❌ 不問受眾就寫 → 高層 vs 同事用詞不同；✅ 永遠先問 audience\n\n## 延伸閱讀\n\n- 官方檔：[`skills/internal-comms/SKILL.md`](../../skills/internal-comms/SKILL.md)\n- 4 份格式範本：[`skills/internal-comms/examples/`](../../skills/internal-comms/examples/)\n- 配對閱讀：[doc-coauthoring](../01-document-skills/doc-coauthoring.md)（更通用的協作文件流程）\n"},{"path":"04-enterprise-skills/theme-factory.md","title":"theme-factory — 10 套主題＋客製主題工廠","content":"# theme-factory — 10 套主題＋客製主題工廠\n\n## 一句話定位\n\n提供 10 套精選色彩／字型主題，每套含 4 色調色盤＋字型配對＋使用情境建議；附上一張 PDF showcase 給人類選擇；不滿意還可即時生成客製主題。\n\n## 何時觸發\n\n- \"套用主題\"、\"幫這個 deck 配色\"、\"make it look professional\"\n- 簡報、文件、報告、HTML landing page 的視覺整體化\n- 不確定該用什麼主題時——直接 show 出 showcase\n\n## 目錄結構速覽\n\n```\nskills/theme-factory/\n├── SKILL.md                     # 流程說明\n├── theme-showcase.pdf           # 🌟 10 主題的視覺索引（給人看）\n├── LICENSE.txt\n└── themes/                      # 10 個主題檔\n    ├── ocean-depths.md          # 海洋深處（企業／金融）\n    ├── sunset-boulevard.md      # 日落大道（暖色／活潑）\n    ├── forest-canopy.md         # 森林樹冠（自然／沉穩）\n    ├── modern-minimalist.md     # 現代極簡（灰階）\n    ├── golden-hour.md           # 黃金時刻（秋色／溫暖）\n    ├── arctic-frost.md          # 北極寒霜（冷色／清爽）\n    ├── desert-rose.md           # 沙漠玫瑰（粉土色）\n    ├── tech-innovation.md       # 科技創新（強烈／現代）\n    ├── botanical-garden.md      # 植物園（綠色／有機）\n    └── midnight-galaxy.md       # 午夜銀河（深色／戲劇）\n```\n\n## 核心觀念與工作流\n\n### 4 步驟流程\n\n```\n1. 顯示 theme-showcase.pdf（給使用者視覺挑選）\n2. 詢問選擇\n3. 等待明確確認\n4. 套用對應主題的色／字型到 artifact\n```\n\n### 主題檔結構（以 Ocean Depths 為例）\n\n```markdown\n# Ocean Depths\nA professional and calming maritime theme that evokes the serenity of deep ocean waters.\n\n## Color Palette\n- **Deep Navy**: #1a2332 - Primary background\n- **Teal**: #2d8b8b - Accent\n- **Seafoam**: #a8dadc - Secondary accent\n- **Cream**: #f1faee - Text/light backgrounds\n\n## Typography\n- Headers: DejaVu Sans Bold\n- Body: DejaVu Sans\n\n## Best Used For\nCorporate presentations, financial reports, professional consulting decks, trust-building content.\n```\n\n每套都依此 4 段結構：色票、字型、適用情境。\n\n### 10 主題速查\n\n| 主題 | 適用 | 主色傾向 |\n|------|------|----------|\n| **Ocean Depths** | 企業／金融／專業諮詢 | 深藍＋青綠 |\n| **Sunset Boulevard** | 行銷／活動／創意 | 橘紅／紫 |\n| **Forest Canopy** | 永續／自然／非營利 | 深綠＋土棕 |\n| **Modern Minimalist** | 任何「乾淨現代」需求 | 灰階 |\n| **Golden Hour** | 年度回顧／溫情敘事 | 金黃＋暖紅 |\n| **Arctic Frost** | 科技／醫療／純淨感 | 冷藍＋白 |\n| **Desert Rose** | 美妝／生活風格 | 粉土＋砂色 |\n| **Tech Innovation** | 軟體／新創 | 鮮明＋現代強對比 |\n| **Botanical Garden** | 食品／健康／植物 | 多綠層次 |\n| **Midnight Galaxy** | 娛樂／戲劇／品牌 launch | 深色＋星光 |\n\n### 客製主題（fallback）\n\n當 10 種都不合適時，依使用者 brief 即時生成：\n1. 取一個類似命名（\"X + Y\"，如 \"Mountain Mist\"、\"Velvet Studio\"）\n2. 選 4 色（背景 + 強調 + 次強調 + 文字）\n3. 選 1 套字型 pair\n4. 寫 best-used-for\n5. 顯示 review，使用者確認後套用\n\n## 精華 Script 與可提取資源\n\n### 🌟 `theme-showcase.pdf`\n\n> 雖然不是 script，但「視覺索引 PDF」是極具啟發的 pattern——當你的工具有「光看文字選不出來」的選項時，做一張視覺 catalog 比寫 100 行描述有效。\n\n### 📋 主題 .md 檔結構模板\n\n直接套用到自家品牌系統：\n\n```markdown\n# {主題名}\n{一句話形容氛圍}\n\n## Color Palette\n- **{色名}**: #xxxxxx - {用途}\n（4 色）\n\n## Typography\n- Headers: {字型}\n- Body: {字型}\n\n## Best Used For\n{適用情境清單}\n```\n\n統一這個格式後，前端可寫 parser 把 .md 轉成 CSS variables。\n\n## 可移植到自家專案的模式\n\n1. **「Choose-then-Apply」流程**：先 show 選項、等使用者確認、再執行。比直接「我幫你選了 X」更尊重使用者控制權。\n\n2. **視覺 PDF showcase**：當選項視覺差異大時，PDF 比文字描述好用。可推廣到任何「style 多選一」場景。\n\n3. **4 色調色盤足矣**：別寫 12 色 design system，4 色（主背景 + 強調 + 次強調 + 文字）能撐起多數場景。\n\n4. **「Best Used For」標籤**：每個選項標明適用情境，幫助 LLM 與人類快速配對。\n\n5. **Fallback to Custom**：預設選項不夠時即時生成。比強迫使用者「將就」更靈活。\n\n## 常見陷阱（Gotchas）\n\n- ❌ 不顯示 showcase 直接挑 → 使用者不知差異；✅ 一律先 show\n- ❌ 套了主題後忘記檢查對比度 → 文字看不清；✅ 對比 ≥ 4.5:1\n- ❌ 同一個 deck 混用兩個主題 → 視覺破碎；✅ 一個 artifact 一個主題\n- ❌ DejaVu Sans 沒裝 → 字型 fallback；✅ 預先檢查或用 web font\n- ❌ 客製主題無命名 → 之後難複用；✅ 即時取個有意義的名字\n\n## 延伸閱讀\n\n- 官方檔：[`skills/theme-factory/SKILL.md`](../../skills/theme-factory/SKILL.md)\n- 主題集：[`skills/theme-factory/themes/`](../../skills/theme-factory/themes/)\n- 視覺索引：[`skills/theme-factory/theme-showcase.pdf`](../../skills/theme-factory/theme-showcase.pdf)\n- 配對閱讀：[brand-guidelines](./brand-guidelines.md)（Anthropic 自家品牌）、[pptx](../01-document-skills/pptx.md)（也提到 10 套配色）\n"},{"path":"99-cross-skill-patterns.md","title":"跨 Skill 共通模式與設計哲學","content":"# 跨 Skill 共通模式與設計哲學\n\n讀完 17 個 skills 後，可歸納出 Anthropic 在設計 skill 時反覆使用的**元 pattern**。把這些 pattern 內化，能讓你做出更系統化、可維護的 skills。\n\n---\n\n## Pattern 1: Office Unpack/Pack/Validate 共享基建\n\n**出現於**：docx、pptx、xlsx\n\n三者底層是同一套 ZIP+XML 結構，所以共用 `scripts/office/`：\n- `unpack.py` — 拆解 + 美化 + 智慧引號實體化\n- `pack.py` — 重組 + 自動修正 durableId 與 xml:space\n- `validate.py` — OOXML schema 驗證\n- `soffice.py` — LibreOffice headless 包裝\n\n**啟示**：當多個 skill 處理結構相近的格式時，**抽出共享 utilities**，每個 skill 用 symlink 或 import 引用。\n\n---\n\n## Pattern 2: Philosophy-First 雙步驟設計法\n\n**出現於**：canvas-design、algorithmic-art\n\n兩者都要求：\n1. **Step 1：寫 4–6 段美學宣言**（命名一個流派、描述 form/space/color/composition）\n2. **Step 2：用具體技術實現**（PIL 畫到 PDF、p5.js 寫到 HTML）\n\n**啟示**：任何「主觀美學任務」都該強迫先寫宣言再執行，避免「先動手，再調整」的隨機輸出。可推廣：\n- 寫部落格文章前先寫「角度宣言」\n- 寫程式前先寫「設計目標宣言」\n- UI 重設計前先選 tone（見 [frontend-design](./03-dev-technical-skills/frontend-design.md)）\n\n---\n\n## Pattern 3: Black-box Script 哲學\n\n**出現於**：webapp-testing、web-artifacts-builder、skill-creator\n\n明確要求：**先 `--help` 再用，除非絕對必要否則不要讀原始碼**。\n\n引用原文：\n> These scripts can be very large and thus pollute your context window. They exist to be called directly as black-box scripts rather than ingested into your context window.\n\n**啟示**：寫給 LLM 用的 CLI 工具，一定要：\n- 完善 `--help` 輸出\n- 命令列接口穩定\n- 預設值合理\n- 錯誤訊息 actionable\n\n---\n\n## Pattern 4: Reconnaissance-then-Action（偵察後行動）\n\n**出現於**：webapp-testing（明確）、pdf 表單填寫（隱含）、pptx 視覺 QA（隱含）\n\n```\n1. 先「偵察」現況（截圖、列 DOM、抽 schema）\n2. 從偵察結果決定 selector / 行動 / 參數\n3. 再「執行」\n```\n\n**啟示**：不確定環境的自動化任務都該分這兩階段，避免假設失誤導致整體失敗。\n\n---\n\n## Pattern 5: Fresh-Eyes Subagent QA\n\n**出現於**：doc-coauthoring、pptx、skill-creator\n\n派一個**沒有對話歷史**的 subagent 來：\n- 讀文件並提問（doc-coauthoring）\n- 看簡報截圖找視覺問題（pptx）\n- 評分 skill 輸出（skill-creator 的 grader）\n\n**啟示**：作者／執行者有盲點。把「審查」工作交給冷讀者 subagent，是 LLM 應用獨有且強大的 pattern。\n\n---\n\n## Pattern 6: Eval-Driven Iteration\n\n**出現於**：skill-creator（核心）、mcp-builder（4-Phase 的 Phase 4）\n\n迴圈：\n```\n寫測試 → 跑測試 → 看結果 → 改 → 重跑\n```\n\nskill-creator 甚至自動化此流程到 `run_loop.py`：5 輪自動優化 description。\n\n**啟示**：任何「LLM 輔助開發」工具都該有客觀題庫，避免「看起來會用了」的主觀錯覺。\n\n---\n\n## Pattern 7: Progressive Disclosure（漸進式揭露）\n\n**出現於**：claude-api、mcp-builder、pdf\n\n主 SKILL.md 簡潔，把細節推到子目錄：\n- `references/`、`shared/`、`reference/`\n- 子目錄按主題或語言切分\n\n```\nmcp-builder/\n├── SKILL.md                      # ~200 行：路由 + 4 phase\n└── reference/\n    ├── mcp_best_practices.md     # 通用規範\n    ├── node_mcp_server.md        # ~550 行：TS 詳解\n    ├── python_mcp_server.md      # ~550 行：Py 詳解\n    └── evaluation.md\n```\n\n**啟示**：別把所有資訊塞進 SKILL.md。Claude 是動態載入的，**根據觸發情境只讀需要的**才能省 token。\n\n---\n\n## Pattern 8: Type Router + Examples 子目錄\n\n**出現於**：internal-comms（4 種 comms 類型）、theme-factory（10 套主題）\n\n主 SKILL.md 是路由：「判斷類型 → 載入對應子檔」。\n\n**啟示**：當 skill 處理多個子類型時，這個結構讓：\n- Claude 只載入相關 example，省 context\n- 新增類型不影響既有\n- 結構自我說明（資料夾即文件）\n\n---\n\n## Pattern 9: Pushy Description（有點推銷感的描述）\n\n**出現於**：skill-creator 明確建議；docx、pdf 等實際採用\n\nskill-creator 直接點名：\n> 反例：`How to build a dashboard.`\n> 正例：`How to build a dashboard. Make sure to use this skill whenever the user mentions dashboards, data visualization, internal metrics, or wants to display any kind of company data, even if they don't explicitly ask for a 'dashboard.'`\n\n**啟示**：因為 Claude 傾向 undertrigger，描述要：\n- 列具體觸發字眼\n- 多舉幾個情境\n- 用 \"Make sure to use\" 等強烈語彙\n\n但要**配對 near-miss negatives**確認沒 overtrigger（見 skill-creator 的 trigger eval 流程）。\n\n---\n\n## Pattern 10: 視覺索引（Showcase）\n\n**出現於**：theme-factory（PDF）、algorithmic-art（viewer.html）、pptx（thumbnail.py 拼圖）\n\n當「光看文字選不出來」時，提供視覺 catalog。\n\n**啟示**：UI 工具、設計工具、樣式選擇——任何視覺差異敏感的場景都該有 showcase。\n\n---\n\n## Pattern 11: Validator/Linter 前置檢查\n\n**出現於**：docx（validate.py）、xlsx（recalc.py 報錯）、slack-gif-creator（validators.py）、pptx（validate.py）\n\n每個產出檔案的 skill 都附驗證器，輸出前自動檢查：\n- Schema 合規\n- 規格限制（GIF 大小、Slack 限制）\n- 公式錯誤（#REF! 等）\n\n**啟示**：任何工具的最後一步都該有 lint/validate，不要把問題推給 end user 去發現。\n\n---\n\n## Pattern 12: 最簡可用形態（Minimum Viable Skill）\n\n**出現於**：brand-guidelines（純文字規範）、frontend-design（純設計思考）、doc-coauthoring（純流程）\n\n證明：**Skill 不一定要有 script**。當核心價值是「規範／流程／思維框架」時，純文字 instruction 已足夠。\n\n**啟示**：別過度工程。問自己「這個 skill 真的需要程式碼嗎？」很多時候一份好寫的 SKILL.md 就贏了。\n\n---\n\n## Pattern 13: Smart Fallback\n\n**出現於**：brand-guidelines（字型 fallback）、claude-api（語言偵測 fallback 到 Python）\n\n當依賴條件不滿足，**降級而非阻擋**：\n- 字型沒裝 → 用 Arial/Georgia\n- 語言難判斷 → 預設 Python 並提示\n\n**啟示**：工具不該因為「環境不完美」就罷工，要 graceful degrade。\n\n---\n\n## Pattern 14: 跨 Skill 互相引用\n\n**出現於**：多個 skill SKILL.md 內\n\n例如：\n- `web-artifacts-builder` 提醒避免 AI slop → 推薦讀 `frontend-design`\n- `pptx` 的視覺 QA 概念 → 與 `doc-coauthoring` 的 reader test 同源\n- `theme-factory` 與 `brand-guidelines` 互補\n\n**啟示**：Skill 之間應該有引用網絡，不要互相孤立。在自家 skill ecosystem 裡建立交叉引用，提升可發現性。\n\n---\n\n## 總結：12 條 Skill 設計鐵律\n\n1. ✅ 共享基建抽 utilities，不重複實作\n2. ✅ 主觀任務先寫宣言再執行\n3. ✅ Script 設計成 black box（`--help` 友善）\n4. ✅ 不確定環境先偵察再行動\n5. ✅ 用 fresh-eyes subagent 做 QA\n6. ✅ Eval-driven 迭代，不憑感覺\n7. ✅ Progressive disclosure，分層揭露\n8. ✅ 多子類型用 router + examples 結構\n9. ✅ Description 寫得 pushy 但要 negative test\n10. ✅ 視覺差異大就做 showcase\n11. ✅ 最後一步必驗證\n12. ✅ 最簡可用：能不寫 script 就別寫\n13. ✅ Smart fallback，不要阻擋使用者\n14. ✅ Skill 互相引用，建立網絡\n\n---\n\n## 推薦進一步閱讀\n\n- 官方 spec：<https://agentskills.io/specification>\n- 原始 SKILL.md 之最佳範本：[`skills/skill-creator/SKILL.md`](../skills/skill-creator/SKILL.md)（meta，最完整）\n- 哲學優先範本：[`skills/algorithmic-art/SKILL.md`](../skills/algorithmic-art/SKILL.md)\n- 簡潔風範本：[`skills/brand-guidelines/SKILL.md`](../skills/brand-guidelines/SKILL.md)\n- 4-Phase 工作流範本：[`skills/mcp-builder/SKILL.md`](../skills/mcp-builder/SKILL.md)\n"},{"path":"README.md","title":"Claude 官方 Skills 繁體中文秘笈手冊","content":"# Claude 官方 Skills 繁體中文秘笈手冊\n\n> 本手冊為 Anthropic 官方 [Claude Skills](https://github.com/anthropics/skills) 的繁體中文導覽與精華萃取，協助開發者快速翻閱所需能力、提取可重用 script、並了解 Anthropic 設計團隊的 best practices。\n\n## 為什麼需要這本秘笈？\n\n官方 17 個 skills 散落於不同子資料夾，每個 SKILL.md 動輒上千行英文，新手很難一次掌握全貌。本手冊將每個 skill 濃縮成 **150–300 行繁中說明**，並依據以下原則組織：\n\n- **可快速翻閱**：八大段固定格式，5 分鐘讀懂一個 skill\n- **可直接提取**：每個 skill 列出最有重用價值的 script 與檔案路徑\n- **跨 skill 視角**：在 [99-cross-skill-patterns.md](./99-cross-skill-patterns.md) 歸納共通設計哲學\n\n---\n\n## 17 個 Skills 全覽\n\n### 📄 文件處理類（5）\n| Skill | 中文簡介 | 主要技術 |\n|-------|----------|----------|\n| [docx](./01-document-skills/docx.md) | Word 文件建立、編輯、追蹤修訂、註解 | docx-js + XML unpack/pack |\n| [pdf](./01-document-skills/pdf.md) | PDF 讀寫、合併、表單填寫、OCR | pypdf / pdfplumber / reportlab |\n| [pptx](./01-document-skills/pptx.md) | 簡報製作、編修、視覺 QA | pptxgenjs + LibreOffice |\n| [xlsx](./01-document-skills/xlsx.md) | 試算表、財務模型、公式運算 | openpyxl + LibreOffice recalc |\n| [doc-coauthoring](./01-document-skills/doc-coauthoring.md) | 結構化共筆流程 | 三階段協作法 |\n\n### 🎨 創意設計類（3）\n| Skill | 中文簡介 | 主要技術 |\n|-------|----------|----------|\n| [canvas-design](./02-creative-skills/canvas-design.md) | 海報、視覺藝術 .pdf/.png | 設計哲學優先 + 30+ 字型 |\n| [algorithmic-art](./02-creative-skills/algorithmic-art.md) | 程式生成藝術 | p5.js + 種子隨機 + 互動參數 |\n| [slack-gif-creator](./02-creative-skills/slack-gif-creator.md) | Slack 動畫 GIF | PIL + GIFBuilder + easing |\n\n### 🛠️ 開發技術類（6）\n| Skill | 中文簡介 | 主要技術 |\n|-------|----------|----------|\n| [claude-api](./03-dev-technical-skills/claude-api.md) | Claude API / SDK 開發 | 多語言 + Managed Agents + 快取 |\n| [mcp-builder](./03-dev-technical-skills/mcp-builder.md) | MCP Server 開發 | TypeScript / Python + 評估 |\n| [skill-creator](./03-dev-technical-skills/skill-creator.md) | 撰寫 Skill 的 Skill（meta） | Eval / Benchmark / 描述優化 |\n| [webapp-testing](./03-dev-t
