echnical-skills/webapp-testing.md) | Playwright Web 測試 | with_server.py 多伺服器管理 |\n| [web-artifacts-builder](./03-dev-technical-skills/web-artifacts-builder.md) | React + shadcn artifact | Vite + Parcel + 內聯打包 |\n| [frontend-design](./03-dev-technical-skills/frontend-design.md) | 前端設計品質指南 | 反 AI slop 設計清單 |\n\n### 🏢 企業溝通類（3）\n| Skill | 中文簡介 | 主要技術 |\n|-------|----------|----------|\n| [internal-comms](./04-enterprise-skills/internal-comms.md) | 內部溝通文件 | 3P 更新 / 週報 / FAQ |\n| [brand-guidelines](./04-enterprise-skills/brand-guidelines.md) | Anthropic 品牌規範 | 6 色 + Poppins/Lora |\n| [theme-factory](./04-enterprise-skills/theme-factory.md) | 主題化樣式工廠 | 10 套預設主題 |\n\n---\n\n## 推薦閱讀路徑\n\n### 我是 Claude Skills 新手\n1. 先讀 [00-skills-spec-and-template.md](./00-skills-spec-and-template.md) 了解 Skill 是什麼\n2. 看 [skill-creator](./03-dev-technical-skills/skill-creator.md) — meta-skill，了解 skill 開發全流程\n3. 挑一個最貼近你工作的 skill 細讀（如後端工程師看 mcp-builder、設計師看 canvas-design）\n4. 最後讀 [99-cross-skill-patterns.md](./99-cross-skill-patterns.md) 看設計大圖\n\n### 我想直接抓 script 來用\n最有重用價值的 script TOP 5：\n1. **`skills/slack-gif-creator/core/easing.py`** — 9 種緩動函式，立即可用\n2. **`skills/webapp-testing/scripts/with_server.py`** — 多 server 生命週期管理\n3. **`skills/skill-creator/scripts/run_loop.py`** — Skill 描述自動優化迴圈\n4. **`skills/docx/scripts/office/unpack.py`** + `pack.py` — Office 文件 ZIP 拆解／重組\n5. **`skills/pdf/scripts/fill_fillable_fields.py`** — PDF 表單填寫\n\n### 我要做特定任務\n- **產生 Word 報告** → [docx](./01-document-skills/docx.md)\n- **PPT 自動化** → [pptx](./01-document-skills/pptx.md)\n- **整合外部 API 給 LLM 用** → [mcp-builder](./03-dev-technical-skills/mcp-builder.md)\n- **建立可分享的 React artifact** → [web-artifacts-builder](./03-dev-technical-skills/web-artifacts-builder.md)\n- **建立公司內部 chatbot 文件樣板** → [internal-comms](./04-enterprise-skills/internal-comms.md)\n\n---\n\n## 每篇 Skill 文件的固定結構\n\n```\n1. 一句話定位\n2. 何時觸發\n3. 目錄結構速覽\n4. 核心觀念與工作流\n5. 精華 Script 與可提取資源\n6. 可移植到自家專案的模式\n7. 常見陷阱（Gotchas）\n8. 延伸閱讀\n```\n\n---\n\n## 授權\n\n本手冊為對官方 skills 的繁中導讀，原始 skills 的授權見各 skill 資料夾下的 `LICENSE.txt`：\n- 多數 example skills 為 Apache 2.0\n- 文件類（docx/pdf/pptx/xlsx）為 Anthropic 自有授權（source-available）\n\n請務必檢視各 skill 自身授權後再轉用。\n\n---\n\n## 維護資訊\n\n- 製作日期：2026-05-06\n- 對應 skills 倉庫 commit：見 git log\n- 若官方 skills 有重大更新，本手冊需同步修訂\n"}]}</script>

  <script>
  (function(){
    const data = JSON.parse(document.getElementById("cookbook-data").textContent);
    const sidebarEl = document.getElementById("sidebar");
    const mdEl = document.getElementById("md");
    const searchEl = document.getElementById("search");

    const CAT_META = {
      "01-document-skills":  { icon: "📄", label: "文件處理" },
      "02-creative-skills":  { icon: "🎨", label: "創意設計" },
      "03-dev-technical-skills": { icon: "🛠️", label: "開發技術" },
      "04-enterprise-skills": { icon: "🏢", label: "企業溝通" }
    };
    const ROOT_ICON = "📌";

    function groupFiles(files){
      const roots = [];
      const cats = {};
      for (const f of files){
        const i = f.path.indexOf("/");
        if (i === -1) roots.push(f);
        else {
          const slug = f.path.slice(0, i);
          (cats[slug] = cats[slug] || []).push(f);
        }
      }
      return { roots, cats };
    }

    const collapsed = new Set();

    function escapeHtml(s){
      return s.replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    function makePreview(content, q){
      if (!q) return "";
      const lc = content.toLowerCase();
      const idx = lc.indexOf(q.toLowerCase());
      if (idx === -1) return "";
      const start = Math.max(0, idx - 30);
      const end = Math.min(content.length, idx + q.length + 60);
      let snippet = content.slice(start, end).replace(/\s+/g, " ").trim();
      if (start > 0) snippet = "…" + snippet;
      if (end < content.length) snippet = snippet + "…";
      const safe = escapeHtml(snippet);
      const re = new RegExp(escapeHtml(q).replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&"), "gi");
      return safe.replace(re, m => "<mark>"+m+"</mark>");
    }

    function fileMatches(file, q){
      if (!q) return true;
      const lq = q.toLowerCase();
      return file.title.toLowerCase().includes(lq)
          || file.path.toLowerCase().includes(lq)
          || file.content.toLowerCase().includes(lq);
    }

    function render(query){
      const groups = groupFiles(data.files);
      const cur = currentPath();
      const q = (query || "").trim();
      const html = [];

      // Roots
      const visibleRoots = groups.roots.filter(f => fileMatches(f, q));
      if (visibleRoots.length){
        html.push('<div class="cat"><div class="cat-head" data-noop="1"><span class="arrow"></span>'+ ROOT_ICON +' &nbsp;入口</div><div class="files">');
        for (const f of visibleRoots){
          const active = f.path === cur ? " active" : "";
          const preview = makePreview(f.content, q);
          html.push('<a class="file'+ active +'" data-path="'+ encodeURIComponent(f.path) +'" href="#'+ encodeURIComponent(f.path) +'">'+ escapeHtml(f.title) + (preview ? '<span class="preview">'+preview+'</span>' : "") +'</a>');
        }
        html.push('</div></div>');
      }

      // Categories (sorted by slug)
      const slugs = Object.keys(groups.cats).sort();
      for (const slug of slugs){
        const meta = CAT_META[slug] || { icon: "📁", label: slug };
        const files = groups.cats[slug].filter(f => fileMatches(f, q));
        if (q && files.length === 0) continue;
        const isCollapsed = collapsed.has(slug) && !q;
        html.push('<div class="cat'+ (isCollapsed ? " collapsed" : "") +'" data-slug="'+ slug +'"><div class="cat-head" data-toggle="'+ slug +'"><span class="arrow">'+ (isCollapsed ? "▶" : "▼") +'</span>'+ meta.icon +' &nbsp;'+ escapeHtml(meta.label) +'</div><div class="files">');
        for (const f of files){
          const active = f.path === cur ? " active" : "";
          const preview = makePreview(f.content, q);
          const shortTitle = f.title.replace(/^[a-z0-9_-]+ — /i, "");
          html.push('<a class="file'+ active +'" data-path="'+ encodeURIComponent(f.path) +'" href="#'+ encodeURIComponent(f.path) +'">'+ escapeHtml(shortTitle || f.title) + (preview ? '<span class="preview">'+preview+'</span>' : "") +'</a>');
        }
        html.push('</div></div>');
      }

      if (!html.length){
        html.push('<div class="empty">沒有匹配的內容</div>');
      }

      sidebarEl.innerHTML = html.join("");
    }

    function currentPath(){
      const h = decodeURIComponent(location.hash.slice(1));
      return h || "README.md";
    }

    function loadPage(){
      const path = currentPath();
      const file = data.files.find(f => f.path === path);
      if (!file){
        mdEl.innerHTML = '<h1>找不到頁面</h1><p>路徑：<code>'+ escapeHtml(path) +'</code></p>';
        return;
      }
      try {
        mdEl.innerHTML = marked.parse(file.content);
      } catch (e) {
        mdEl.innerHTML = '<pre>'+ escapeHtml(file.content) +'</pre>';
      }
      // Highlight code
      mdEl.querySelectorAll("pre code").forEach(b => {
        try { hljs.highlightElement(b); } catch(_){}
      });
      // Rewrite relative .md links to hash routes
      mdEl.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute("href");
        if (!href) return;
        if (/^https?:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
        if (href.startsWith("#")) return;
        const cleaned = href.replace(/^\.\//, "").replace(/^\.\.\//,"");
        const candidate = resolveRelative(path, cleaned);
        if (candidate && data.files.some(f => f.path === candidate)){
          a.setAttribute("href", "#" + encodeURIComponent(candidate));
        }
      });
      document.title = (file.title || file.path) + " — Cookbook";
      // Update active state
      sidebarEl.querySelectorAll(".file").forEach(el => {
        el.classList.toggle("active", decodeURIComponent(el.dataset.path) === path);
      });
      // Scroll content to top
      document.getElementById("content").scrollTo({ top: 0 });
    }

    function resolveRelative(currentPath, target){
      const parts = currentPath.split("/").slice(0, -1);
      const tparts = target.split("/");
      for (const p of tparts){
        if (p === "..") parts.pop();
        else if (p !== ".") parts.push(p);
      }
      return parts.join("/");
    }

    // Sidebar interactions
    sidebarEl.addEventListener("click", e => {
      const tgl = e.target.closest("[data-toggle]");
      if (tgl){
        const slug = tgl.dataset.toggle;
        if (collapsed.has(slug)) collapsed.delete(slug); else collapsed.add(slug);
        render(searchEl.value);
        return;
      }
    });

    // Search
    let searchTimer;
    searchEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => render(searchEl.value), 80);
    });

    window.addEventListener("hashchange", loadPage);

    // Initial render
    render("");
    loadPage();
  })();
  </script>
</body>
</html>
