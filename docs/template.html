<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cookbook — Claude Skills 繁中手冊</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
      color:#141413;background:#faf9f5;line-height:1.6;
    }
    /* Layout */
    .app{display:flex;flex-direction:column;height:100%}
    header.topbar{
      background:#141413;color:#faf9f5;padding:.6rem 1rem;
      display:flex;gap:1rem;align-items:center;flex-wrap:wrap;
      border-bottom:1px solid #2a2a28;flex:0 0 auto;
    }
    header.topbar h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.5px}
    header.topbar .sub{font-size:.78rem;color:#b0aea5;margin-right:auto}
    header.topbar input{
      background:#26261f;border:1px solid #3a3a32;color:#faf9f5;
      padding:.4rem .7rem;border-radius:6px;font-size:.85rem;
      min-width:240px;
    }
    header.topbar input::placeholder{color:#7a7870}
    header.topbar input:focus{outline:none;border-color:#d97757}
    header.topbar a{color:#d97757;text-decoration:none;font-size:.78rem}
    header.topbar a:hover{text-decoration:underline}

    main.shell{display:flex;flex:1 1 auto;overflow:hidden}
    aside.sidebar{
      width:260px;flex:0 0 260px;background:#f3f1e7;border-right:1px solid #e8e6dc;
      overflow-y:auto;padding:.5rem;
    }
    aside.sidebar .cat{margin-bottom:.6rem}
    aside.sidebar .cat-head{
      display:flex;align-items:center;cursor:pointer;
      font-weight:700;font-size:.85rem;padding:.4rem .5rem;border-radius:4px;
      user-select:none;
    }
    aside.sidebar .cat-head:hover{background:#e8e6dc}
    aside.sidebar .cat-head .arrow{margin-right:.3rem;font-size:.65rem;width:1em;display:inline-block;color:#7a7870}
    aside.sidebar .cat.collapsed .files{display:none}
    aside.sidebar .files{margin-left:.5rem;border-left:1px solid #e8e6dc;padding-left:.4rem}
    aside.sidebar .file{
      display:block;padding:.3rem .5rem;font-size:.85rem;color:#141413;
      text-decoration:none;border-radius:3px;margin:.05rem 0;cursor:pointer;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    aside.sidebar .file:hover{background:#e8e6dc}
    aside.sidebar .file.active{background:rgba(217,119,87,.15);color:#d97757;font-weight:600}
    aside.sidebar .file .preview{display:block;font-size:.7rem;color:#7a7870;margin-top:.15rem;font-weight:400;white-space:normal}
    aside.sidebar .empty{padding:1rem;color:#7a7870;font-size:.85rem;text-align:center}

    article.content{flex:1 1 auto;overflow-y:auto;padding:2rem 2.5rem;max-width:none}
    article.content .inner{max-width:820px;margin:0 auto}

    /* Markdown styles */
    .md h1{font-size:1.9rem;border-bottom:1px solid #e8e6dc;padding-bottom:.4rem;margin-top:.5rem;margin-bottom:1.2rem}
    .md h2{font-size:1.45rem;margin-top:2rem;margin-bottom:.7rem}
    .md h3{font-size:1.2rem;margin-top:1.5rem;margin-bottom:.5rem}
    .md h4{font-size:1.05rem;margin-top:1.2rem;margin-bottom:.4rem}
    .md p{margin:.7rem 0}
    .md ul,.md ol{padding-left:1.6rem;margin:.5rem 0}
    .md li{margin:.2rem 0}
    .md a{color:#6a9bcc;text-decoration:underline}
    .md a:hover{color:#d97757}
    .md blockquote{border-left:4px solid #d97757;background:#f3f1e7;margin:.8rem 0;padding:.5rem .9rem;color:#3a3a32}
    .md code{background:#e8e6dc;padding:1px 6px;border-radius:3px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
    .md pre{background:#141413;color:#faf9f5;padding:.9rem 1rem;border-radius:6px;overflow-x:auto;margin:.8rem 0}
    .md pre code{background:transparent;padding:0;color:inherit;font-size:.85rem;line-height:1.55}
    .md table{border-collapse:collapse;margin:.8rem 0;width:100%;font-size:.92rem}
    .md th,.md td{border:1px solid #e8e6dc;padding:.4rem .65rem;text-align:left;vertical-align:top}
    .md th{background:#f3f1e7;font-weight:700}
    .md hr{border:0;border-top:1px solid #e8e6dc;margin:1.5rem 0}
    .md img{max-width:100%}
    .md kbd{background:#e8e6dc;border:1px solid #b0aea5;border-bottom-width:2px;border-radius:3px;padding:1px 5px;font-size:.8em;font-family:ui-monospace,monospace}

    /* highlight.js theme overrides (matches dark code blocks) */
    .hljs{background:transparent;color:#faf9f5}
    .hljs-comment,.hljs-quote{color:#9aa0a6;font-style:italic}
    .hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-tag{color:#d97757}
    .hljs-string,.hljs-doctag{color:#a3be8c}
    .hljs-number,.hljs-regexp,.hljs-symbol{color:#88c0d0}
    .hljs-title,.hljs-section,.hljs-name,.hljs-built_in{color:#6a9bcc}
    .hljs-variable,.hljs-template-variable,.hljs-attr{color:#ebcb8b}
    .hljs-type,.hljs-class .hljs-title{color:#788c5d}
    .hljs-meta{color:#b48ead}

    /* Search highlight in preview */
    .preview mark{background:#ffeebd;color:#141413;padding:0 1px;border-radius:2px}

    /* Responsive */
    @media (max-width:768px){
      main.shell{flex-direction:column}
      aside.sidebar{width:100%;flex:0 0 auto;max-height:40vh;border-right:none;border-bottom:1px solid #e8e6dc}
      article.content{padding:1.2rem}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>📘 Cookbook</h1>
      <span class="sub">Claude Skills 繁中學習手冊 · 純靜態瀏覽版</span>
      <input id="search" type="search" placeholder="搜尋 cookbook（標題或內文）..." autocomplete="off" />
      <a href="https://github.com/anthropics/skills" target="_blank" rel="noopener">官方 Skills ↗</a>
    </header>
    <main class="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <article class="content" id="content"><div class="inner md" id="md"></div></article>
    </main>
  </div>

  <script type="application/json" id="cookbook-data">__COOKBOOK_DATA__</script>
  <script>__MARKED_JS__</script>
  <script>__HIGHLIGHT_JS__</script>
  <script>
  (function(){
    const data = JSON.parse(document.getElementById("cookbook-data").textContent);
    const sidebarEl = document.getElementById("sidebar");
    const mdEl = document.getElementById("md");
    const searchEl = document.getElementById("search");

    const CAT_META = {
      "01-document-skills":  { icon: "📄", label: "文件處理" },
      "02-creative-skills":  { icon: "🎨", label: "創意設計" },
      "03-dev-technical-skills": { icon: "🛠️", label: "開發技術" },
      "04-enterprise-skills": { icon: "🏢", label: "企業溝通" }
    };
    const ROOT_ICON = "📌";

    function groupFiles(files){
      const roots = [];
      const cats = {};
      for (const f of files){
        const i = f.path.indexOf("/");
        if (i === -1) roots.push(f);
        else {
          const slug = f.path.slice(0, i);
          (cats[slug] = cats[slug] || []).push(f);
        }
      }
      return { roots, cats };
    }

    const collapsed = new Set();

    function escapeHtml(s){
      return s.replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      })[c]);
    }

    function makePreview(content, q){
      if (!q) return "";
      const lc = content.toLowerCase();
      const idx = lc.indexOf(q.toLowerCase());
      if (idx === -1) return "";
      const start = Math.max(0, idx - 30);
      const end = Math.min(content.length, idx + q.length + 60);
      let snippet = content.slice(start, end).replace(/\s+/g, " ").trim();
      if (start > 0) snippet = "…" + snippet;
      if (end < content.length) snippet = snippet + "…";
      const safe = escapeHtml(snippet);
      const re = new RegExp(escapeHtml(q).replace(/[-\/\\^$*+?.()|[\]{}]/g,"\\$&"), "gi");
      return safe.replace(re, m => "<mark>"+m+"</mark>");
    }

    function fileMatches(file, q){
      if (!q) return true;
      const lq = q.toLowerCase();
      return file.title.toLowerCase().includes(lq)
          || file.path.toLowerCase().includes(lq)
          || file.content.toLowerCase().includes(lq);
    }

    function render(query){
      const groups = groupFiles(data.files);
      const cur = currentPath();
      const q = (query || "").trim();
      const html = [];

      // Roots
      const visibleRoots = groups.roots.filter(f => fileMatches(f, q));
      if (visibleRoots.length){
        html.push('<div class="cat"><div class="cat-head" data-noop="1"><span class="arrow"></span>'+ ROOT_ICON +' &nbsp;入口</div><div class="files">');
        for (const f of visibleRoots){
          const active = f.path === cur ? " active" : "";
          const preview = makePreview(f.content, q);
          html.push('<a class="file'+ active +'" data-path="'+ encodeURIComponent(f.path) +'" href="#'+ encodeURIComponent(f.path) +'">'+ escapeHtml(f.title) + (preview ? '<span class="preview">'+preview+'</span>' : "") +'</a>');
        }
        html.push('</div></div>');
      }

      // Categories (sorted by slug)
      const slugs = Object.keys(groups.cats).sort();
      for (const slug of slugs){
        const meta = CAT_META[slug] || { icon: "📁", label: slug };
        const files = groups.cats[slug].filter(f => fileMatches(f, q));
        if (q && files.length === 0) continue;
        const isCollapsed = collapsed.has(slug) && !q;
        html.push('<div class="cat'+ (isCollapsed ? " collapsed" : "") +'" data-slug="'+ slug +'"><div class="cat-head" data-toggle="'+ slug +'"><span class="arrow">'+ (isCollapsed ? "▶" : "▼") +'</span>'+ meta.icon +' &nbsp;'+ escapeHtml(meta.label) +'</div><div class="files">');
        for (const f of files){
          const active = f.path === cur ? " active" : "";
          const preview = makePreview(f.content, q);
          const shortTitle = f.title.replace(/^[a-z0-9_-]+ — /i, "");
          html.push('<a class="file'+ active +'" data-path="'+ encodeURIComponent(f.path) +'" href="#'+ encodeURIComponent(f.path) +'">'+ escapeHtml(shortTitle || f.title) + (preview ? '<span class="preview">'+preview+'</span>' : "") +'</a>');
        }
        html.push('</div></div>');
      }

      if (!html.length){
        html.push('<div class="empty">沒有匹配的內容</div>');
      }

      sidebarEl.innerHTML = html.join("");
    }

    function currentPath(){
      const h = decodeURIComponent(location.hash.slice(1));
      return h || "README.md";
    }

    function loadPage(){
      const path = currentPath();
      const file = data.files.find(f => f.path === path);
      if (!file){
        mdEl.innerHTML = '<h1>找不到頁面</h1><p>路徑：<code>'+ escapeHtml(path) +'</code></p>';
        return;
      }
      try {
        mdEl.innerHTML = marked.parse(file.content);
      } catch (e) {
        mdEl.innerHTML = '<pre>'+ escapeHtml(file.content) +'</pre>';
      }
      // Highlight code
      mdEl.querySelectorAll("pre code").forEach(b => {
        try { hljs.highlightElement(b); } catch(_){}
      });
      // Rewrite relative .md links to hash routes
      mdEl.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute("href");
        if (!href) return;
        if (/^https?:/i.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
        if (href.startsWith("#")) return;
        const cleaned = href.replace(/^\.\//, "").replace(/^\.\.\//,"");
        const candidate = resolveRelative(path, cleaned);
        if (candidate && data.files.some(f => f.path === candidate)){
          a.setAttribute("href", "#" + encodeURIComponent(candidate));
        }
      });
      document.title = (file.title || file.path) + " — Cookbook";
      // Update active state
      sidebarEl.querySelectorAll(".file").forEach(el => {
        el.classList.toggle("active", decodeURIComponent(el.dataset.path) === path);
      });
      // Scroll content to top
      document.getElementById("content").scrollTo({ top: 0 });
    }

    function resolveRelative(currentPath, target){
      const parts = currentPath.split("/").slice(0, -1);
      const tparts = target.split("/");
      for (const p of tparts){
        if (p === "..") parts.pop();
        else if (p !== ".") parts.push(p);
      }
      return parts.join("/");
    }

    // Sidebar interactions
    sidebarEl.addEventListener("click", e => {
      const tgl = e.target.closest("[data-toggle]");
      if (tgl){
        const slug = tgl.dataset.toggle;
        if (collapsed.has(slug)) collapsed.delete(slug); else collapsed.add(slug);
        render(searchEl.value);
        return;
      }
    });

    // Search
    let searchTimer;
    searchEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => render(searchEl.value), 80);
    });

    window.addEventListener("hashchange", loadPage);

    // Initial render
    render("");
    loadPage();
  })();
  </script>
</body>
</html>
